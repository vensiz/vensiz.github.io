<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VENSIZ ADMIN</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:#020403;
color:white;
font-family:tahoma;
min-height:100vh;

}


.box{

width:400px;
max-width:90%;

margin:120px auto;

background:#071008;

border:1px solid rgba(0,255,100,.2);

border-radius:18px;

padding:30px;

}



h1{

text-align:center;

color:#00ff66;

margin-bottom:25px;

}



input{

width:100%;

padding:14px;

margin-bottom:15px;

background:#030604;

border:1px solid rgba(0,255,100,.2);

border-radius:10px;

color:white;

}



button{

width:100%;

padding:14px;

border:none;

border-radius:10px;

background:#00d95a;

font-weight:bold;

cursor:pointer;

}



button:hover{

background:#00ff66;

}



#message{

text-align:center;

margin-top:15px;

font-size:13px;

}



.error{

color:#ff7777;

}


.success{

color:#00ff66;

}



#panel{

display:none;

padding:40px;

}



.card{

background:#071008;

border:1px solid rgba(0,255,100,.15);

border-radius:18px;

padding:30px;

}



.green{

color:#00ff66;

}



</style>

</head>


<body>



<!-- LOGIN -->

<div class="box" id="loginBox">


<h1>
VENSIZ ADMIN
</h1>



<input
id="username"
placeholder="Username"
>



<input
id="password"
type="password"
placeholder="Password"
>



<button id="login">

ورود

</button>



<div id="message"></div>



</div>





<!-- PANEL -->


<div id="panel">


<div class="card">


<h1>
VENSIZ CONTROL PANEL
</h1>


<br>


<p id="adminInfo"></p>


<br><br>


<h3 class="green">
🎫 تیکت ها
</h3>


<br>


<h3 class="green">
🛒 فروشگاه
</h3>


<br>


<h3 class="green">
👥 مدیریت ادمین ها
</h3>



</div>


</div>





<script>


const SUPABASE_URL =
"https://gpeckwmjsgklzhtgqdso.supabase.co";


const SUPABASE_KEY =
"sb_publishable_L4G2SJVjpML_5NiKb4tS7A_qXc5MzTZ";



const db =
supabase.createClient(

SUPABASE_URL,

SUPABASE_KEY

);





const login =
document.getElementById(
"login"
);



const message =
document.getElementById(
"message"
);





login.onclick =
async()=>{


const username =
document
.getElementById(
"username"
)
.value
.trim();



const password =
document
.getElementById(
"password"
)
.value
.trim();





if(
!username ||
!password
){

message.innerHTML =
"اطلاعات را کامل کنید";

message.className =
"error";

return;

}






const {

data,

error

}=

await db

.from("admins")

.select("*")

.eq(
"username",
username
)

.eq(
"password",
password
)

.single();






if(error || !data){


message.innerHTML =
"یوزرنیم یا رمز اشتباه است";


message.className =
"error";


return;


}







localStorage.setItem(

"vensiz_admin",

JSON.stringify(data)

);







document
.getElementById(
"loginBox"
)
.style.display="none";





document
.getElementById(
"panel"
)
.style.display="block";







document
.getElementById(
"adminInfo"
)
.innerHTML =

`

ادمین:
<b class="green">
${data.name}
</b>

<br><br>

رنک:
<b class="green">
${data.rank}
</b>

`;





};





</script>


</body>

</html>
