<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VENSIZ ADMIN</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:tahoma;
}


body{

background:
linear-gradient(rgba(0,255,100,.03) 1px,transparent 1px),
linear-gradient(90deg,rgba(0,255,100,.03) 1px,transparent 1px),
#020403;

background-size:50px 50px;

color:white;

min-height:100vh;

}



header{

height:75px;

background:#030603;

border-bottom:1px solid rgba(0,255,100,.15);

display:flex;

align-items:center;

justify-content:space-between;

padding:0 30px;

}



.logo{

color:#00ff66;

font-size:28px;

font-weight:bold;

text-shadow:0 0 20px #00ff66;

}



.admin-info{

color:#aaa;

}



.layout{

display:flex;

min-height:calc(100vh - 75px);

}



.sidebar{

width:260px;

background:#050805;

border-left:1px solid rgba(0,255,100,.15);

padding:25px;

}



.menu button{

width:100%;

padding:15px;

margin-bottom:12px;

background:#081108;

color:white;

border:1px solid rgba(0,255,100,.15);

border-radius:12px;

cursor:pointer;

text-align:right;

}



.menu button:hover{

border-color:#00ff66;

}



.content{

flex:1;

padding:35px;

}



.dashboard,
.section{

background:#071008;

border:1px solid rgba(0,255,100,.15);

border-radius:18px;

padding:30px;

}



.section{

display:none;

}



.section.active{

display:block;

}



h1,h2{

color:#00ff66;

}



.close{

float:left;

cursor:pointer;

color:#ff7777;

font-size:22px;

}



.card{

margin-top:20px;

padding:20px;

background:#030603;

border-radius:12px;

border:1px solid rgba(255,255,255,.05);

}



input,textarea,select{

width:100%;

padding:12px;

margin-top:10px;

background:#020403;

color:white;

border:1px solid rgba(0,255,100,.2);

border-radius:10px;

}



.action-btn{

margin-top:10px;

padding:12px 20px;

background:#00ff66;

border:none;

border-radius:10px;

cursor:pointer;

}



</style>

</head>


<body>


<header>

<div class="logo">
VENSIZ ADMIN
</div>


<div class="admin-info" id="admin-info">
در حال بررسی...
</div>


</header>



<div class="layout">


<aside class="sidebar">


<div class="menu">


<button onclick="openSection('tickets');loadTickets()">
🎫 مدیریت تیکت‌ها
</button>


<button onclick="openAdminSection()">
👥 مدیریت ادمین‌ها
</button>


<button>
🛒 مدیریت فروشگاه
</button>


</div>


</aside>



<main class="content">


<div id="home" class="dashboard">


<h1>
خوش آمدید
</h1>


<p>
پنل مدیریت VENSIZ
</p>


</div>





<div id="tickets" class="section">


<span class="close" onclick="closeSection('tickets')">
✖
</span>


<h2>
🎫 مدیریت تیکت‌ها
</h2>


<div id="ticket-list">
<div id="ticket-chat" style="display:none">

<h2>💬 چت تیکت</h2>

<div id="chat-info"></div>

<div id="chat-messages"></div>

<textarea id="chat-input" placeholder="پیام..."></textarea>

<button class="action-btn" onclick="sendMessage()">
ارسال
</button>

</div>
در حال دریافت...

</div>


</div>






<div id="admins" class="section">


<span class="close" onclick="closeSection('admins')">
✖
</span>


<h2>
👥 مدیریت ادمین‌ها
</h2>


<div id="admin-list">

</div>


</div>



</main>


</div>

<script>


const SUPABASE_URL =
"https://gpeckwmjsgklzhtgqdso.supabase.co";


const SUPABASE_KEY =
"sb_publishable_L4G2SJVjpML_5NiKb4tS7A_qXc5MzTZ";


const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


let selectedTicket = null;



let currentAdmin =
JSON.parse(
localStorage.getItem("vensiz_admin")
);



if(!currentAdmin){

window.location.href =
"admin-login.html";

}



document.getElementById("admin-info").innerHTML =
`
🛡 ${currentAdmin.name}
|
${currentAdmin.rank}
`;




// باز کردن بخش‌ها

function openSection(id){


document
.querySelectorAll(".section")
.forEach(
x=>x.classList.remove("active")
);


document
.getElementById("home")
.style.display="none";


document
.getElementById(id)
.classList.add("active");


}




function closeSection(id){


document
.getElementById(id)
.classList.remove("active");


document
.getElementById("home")
.style.display="block";


}





// ======================
// تیکت ها
// ======================


async function loadTickets(){


const box =
document.getElementById("ticket-list");



const {data,error}=

await db

.from("tickets")

.select("*")

.order(
"created_at",
{
ascending:false
}
);



if(error){

console.log(error);

box.innerHTML =
"خطا در دریافت تیکت‌ها";

return;

}



if(!data.length){

box.innerHTML =
"تیکتی وجود ندارد";

return;

}



let html="";



data.forEach(ticket=>{


html += `


<div class="card">


<h3>
🎫 ${ticket.ticket_number || ticket.id}
</h3>


<p>
👤 کاربر:
${ticket.user_name || "-"}
</p>


<p>
📌 موضوع:
${ticket.subject || "-"}
</p>


<p>
🏢 بخش:
${ticket.department || "-"}
</p>


<p>
📊 وضعیت:
${ticket.status || "-"}
</p>


<p>
🛡 ادمین مسئول:
${ticket.assigned_admin || "-"}
</p>


<p>
⭐ رنک:
${ticket.admin_rank || "-"}
</p>


<button class="action-btn"
onclick="assignTicket('${ticket.id}')">

گرفتن تیکت

</button>
<button class="action-btn"
onclick="openChat('${ticket.id}')">

💬 باز کردن گفتگو

</button>

</div>


`;

});


box.innerHTML=html;


}







// گرفتن تیکت توسط ادمین


async function assignTicket(id){


await db

.from("tickets")

.update({

assigned_admin:
currentAdmin.name,

admin_rank:
currentAdmin.rank

})

.eq(
"id",
id
);



loadTickets();


}







// ======================
// مدیریت ادمین
// ======================



async function openAdminSection(){



let pass =
prompt(
"رمز مدیریت ادمین:"
);



if(!pass)
return;



const {data,error}=

await db

.from("admin_settings")

.select("*")

.eq(
"id",
1
)

.single();



if(error){

alert(
"تنظیمات پیدا نشد"
);

return;

}



if(pass !== data.admin_password){


alert(
"رمز اشتباه است"
);


return;

}



openSection("admins");


loadAdmins();


}








async function loadAdmins(){


const box =
document.getElementById("admin-list");



const {data,error}=

await db

.from("admins")

.select("*");



if(error){

box.innerHTML =
"خطا";

return;

}



let html="";



data.forEach(admin=>{


html += `


<div class="card">


🛡 ${admin.name}


<br><br>


یوزرنیم:
${admin.username}


<br>


رنک:
${admin.rank}



</div>


`;


});



box.innerHTML=html;


}





</script>
