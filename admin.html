<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VENSIZ ADMIN</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:tahoma;
}

body{

background:
linear-gradient(rgba(0,255,100,.03) 1px,transparent 1px),
linear-gradient(90deg,rgba(0,255,100,.03) 1px,transparent 1px),
#020403;

background-size:50px 50px;

color:white;

min-height:100vh;

}


header{

height:75px;

background:#030603;

border-bottom:1px solid rgba(0,255,100,.15);

display:flex;

align-items:center;

justify-content:space-between;

padding:0 30px;

}


.logo{

color:#00ff66;

font-size:28px;

font-weight:bold;

text-shadow:0 0 20px #00ff66;

}


.admin-info{

color:#aaa;

}


.layout{

display:flex;

min-height:calc(100vh - 75px);

}


.sidebar{

width:260px;

background:#050805;

border-left:1px solid rgba(0,255,100,.15);

padding:25px;

}


.menu button{

width:100%;

padding:15px;

margin-bottom:12px;

background:#081108;

color:white;

border:1px solid rgba(0,255,100,.15);

border-radius:12px;

cursor:pointer;

text-align:right;

}


.menu button:hover{

border-color:#00ff66;

}


.content{

flex:1;

padding:35px;

}


.dashboard,
.section{

background:#071008;

border:1px solid rgba(0,255,100,.15);

border-radius:18px;

padding:30px;

}


.section{

display:none;

}


.section.active{

display:block;

}


h1,h2{

color:#00ff66;

}


.close{

float:left;

cursor:pointer;

color:#ff7777;

font-size:22px;

}


.card{

margin-top:20px;

padding:20px;

background:#030603;

border-radius:12px;

border:1px solid rgba(255,255,255,.05);

}


input,textarea,select{

width:100%;

padding:12px;

margin-top:10px;

background:#020403;

color:white;

border:1px solid rgba(0,255,100,.2);

border-radius:10px;

}


.action-btn{

margin-top:10px;

padding:12px 20px;

background:#00ff66;

border:none;

border-radius:10px;

cursor:pointer;

}


#chat-messages{

height:350px;

overflow:auto;

background:#020403;

padding:15px;

border-radius:12px;

margin-top:15px;

}


.msg-admin{

border-right:3px solid #00ff66;

padding:10px;

margin:10px;

}


.msg-user{

border-right:3px solid #888;

padding:10px;

margin:10px;

}


</style>

</head>


<body>


<header>

<div class="logo">
VENSIZ ADMIN
</div>


<div class="admin-info" id="admin-info">
در حال بررسی...
</div>


</header>


<div class="layout">


<aside class="sidebar">

<div class="menu">


<button onclick="openSection('tickets');loadTickets()">
🎫 مدیریت تیکت‌ها
</button>


<button onclick="openAdminSection()">
👥 مدیریت ادمین‌ها
</button>


<button>
🛒 مدیریت فروشگاه
</button>


</div>

</aside>


<main class="content">


<div id="home" class="dashboard">

<h1>
خوش آمدید
</h1>

<p>
پنل مدیریت VENSIZ
</p>

</div>


<div id="tickets" class="section">

<span class="close" onclick="closeSection('tickets')">
✖
</span>


<h2>
🎫 مدیریت تیکت‌ها
</h2>


<div id="ticket-list">
در حال دریافت...
</div>



<div id="ticket-chat" style="display:none">


<h2>
💬 چت تیکت
</h2>


<div id="chat-info"></div>


<div id="chat-messages"></div>


<textarea id="chat-input" placeholder="پیام ادمین..."></textarea>


<button class="action-btn" onclick="sendMessage()">
ارسال پیام
</button>


</div>


</div>



<div id="admins" class="section">


<span class="close" onclick="closeSection('admins')">
✖
</span>


<h2>
👥 مدیریت ادمین‌ها
</h2>


<div id="admin-list">

</div>


</div>



</main>

</div>


<script>
const SUPABASE_URL =
"https://gpeckwmjsgklzhtgqdso.supabase.co";


const SUPABASE_KEY =
"sb_publishable_L4G2SJVjpML_5NiKb4tS7A_qXc5MzTZ";


const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



const adminData =
JSON.parse(
localStorage.getItem("vensiz_admin")
);



if(!adminData){

window.location.href =
"admin-login.html";

}



document.getElementById("admin-info").innerHTML =
`
🛡 ${adminData.name || adminData.username}
|
${adminData.rank}
`;



let selectedTicket = null;



function openSection(id){

document
.querySelectorAll(".section")
.forEach(
x=>x.classList.remove("active")
);


document
.getElementById("home")
.style.display="none";


document
.getElementById(id)
.classList.add("active");

}



function closeSection(id){

document
.getElementById(id)
.classList.remove("active");


document
.getElementById("home")
.style.display="block";

}




// =====================
// دریافت تیکت ها
// =====================


async function loadTickets(){


const box =
document.getElementById("ticket-list");



const {data,error}=

await db
.from("tickets")
.select("*")
.order(
"created_at",
{
ascending:false
}
);



if(error){

box.innerHTML="خطا در دریافت تیکت‌ها";

console.log(error);

return;

}



if(!data.length){

box.innerHTML="تیکتی وجود ندارد";

return;

}



let html="";



data.forEach(ticket=>{


html += `

<div class="card">


<h3>
🎫 ${ticket.ticket_number || ticket.id}
</h3>


<p>
👤 کاربر:
${ticket.user_name || "-"}
</p>


<p>
📌 موضوع:
${ticket.subject || "-"}
</p>


<p>
🏢 بخش:
${ticket.department || "-"}
</p>


<p>
📊 وضعیت:
${ticket.status || "-"}
</p>


<p>
🛡 مسئول:
${ticket.assigned_admin || "-"}
</p>



<button class="action-btn"
onclick="assignTicket('${ticket.id}')">

گرفتن تیکت

</button>



<button class="action-btn"
onclick="openChat('${ticket.id}')">

💬 گفتگو

</button>


</div>


`;


});


box.innerHTML=html;


}




// =====================
// گرفتن تیکت
// =====================


async function assignTicket(id){


await db
.from("tickets")
.update({

assigned_admin:
adminData.name || adminData.username,


admin_rank:
adminData.rank

})
.eq(
"id",
id
);



loadTickets();


}





// =====================
// باز کردن چت
// =====================


window.openChat=function(id){

alert("باز شد: " + id);

selectedTicket=id;

document
.getElementById("ticket-chat")
.style.display="block";

loadMessages();

};



document
.getElementById("chat-info")
.innerHTML=
`
🎫 تیکت:
${id}
<br>
🛡 ادمین:
${adminData.name || adminData.username}
|
${adminData.rank}
`;



loadMessages();


};




// =====================
// دریافت پیام ها
// =====================


async function loadMessages(){


if(!selectedTicket)
return;



const box =
document.getElementById("chat-messages");



const {data,error}=

await db

.from("ticket_messages")

.select("*")

.eq(
"ticket_id",
selectedTicket
)

.order(
"created_at",
{
ascending:true
}
);



if(error){

box.innerHTML="خطا در دریافت پیام";

console.log(error);

return;

}



box.innerHTML="";



data.forEach(msg=>{


let cls =
msg.sender_type=="admin"
?
"msg-admin"
:
"msg-user";



box.innerHTML +=
`

<div class="${cls}">


<b>
${msg.sender_name}
${msg.sender_rank ? " | "+msg.sender_rank:""}
</b>


<br>


${msg.message}


</div>


`;

});


box.scrollTop =
box.scrollHeight;


}




// =====================
// ارسال پیام ادمین
// =====================


async function sendMessage(){


let input =
document.getElementById("chat-input");



let text =
input.value.trim();



if(!text || !selectedTicket)
return;



const {error}=

await db

.from("ticket_messages")

.insert({

ticket_id:selectedTicket,


sender_type:"admin",


sender_name:
adminData.name || adminData.username,


sender_rank:
adminData.rank,


message:text

});



if(error){

alert(error.message);

return;

}



input.value="";


loadMessages();


}






// =====================
// مدیریت ادمین ها
// =====================


async function openAdminSection(){


openSection("admins");


loadAdmins();


}




async function loadAdmins(){


const box =
document.getElementById("admin-list");



const {data,error}=

await db

.from("admins")

.select("*");



if(error){

box.innerHTML="خطا";

return;

}



let html="";



data.forEach(admin=>{


html +=

`

<div class="card">

🛡 ${admin.name}

<br><br>

یوزرنیم:
${admin.username}

<br>

رنک:
${admin.rank}

</div>

`;



});



box.innerHTML=html;


}




// رفرش خودکار چت

setInterval(()=>{

if(selectedTicket){

loadMessages();

}

},3000);
</script>

</body>
</html>
