<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VENSIZ ADMIN</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:tahoma;
}


body{

    background:
    linear-gradient(rgba(0,255,100,.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,255,100,.03) 1px,transparent 1px),
    #020403;

    background-size:50px 50px;

    color:white;

    min-height:100vh;

}



/* HEADER */

header{

    height:75px;

    background:#030603;

    border-bottom:
    1px solid rgba(0,255,100,.15);

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 30px;

}


.logo{

    color:#00ff66;

    font-size:28px;

    font-weight:bold;

    text-shadow:
    0 0 20px #00ff66;

}


.admin-info{

    color:#aaa;

    font-size:13px;

}



/* LAYOUT */


.layout{

    display:flex;

    min-height:calc(100vh - 75px);

}



/* SIDEBAR */


.sidebar{

    width:260px;

    background:#050805;

    border-left:
    1px solid rgba(0,255,100,.15);

    padding:25px;

}



.menu-title{

    color:#00ff66;

    margin-bottom:25px;

}



.menu button{

    width:100%;

    padding:15px;

    margin-bottom:12px;

    background:#081108;

    color:white;

    border:

    1px solid rgba(0,255,100,.15);

    border-radius:12px;

    cursor:pointer;

    text-align:right;

}



.menu button:hover{

    background:rgba(0,255,100,.08);

    border-color:#00ff66;

}




/* CONTENT */


.content{

    flex:1;

    padding:35px;

}



.dashboard,
.section{

    background:#071008;

    border:

    1px solid rgba(0,255,100,.15);

    border-radius:18px;

    padding:30px;

}



.section{

    display:none;

}



.section.active{

    display:block;

}



.dashboard h1{

    color:#00ff66;

    margin-bottom:15px;

}



.close{

    float:left;

    color:#ff7777;

    cursor:pointer;

    font-size:22px;

}



/* CARD */


.card{

    margin-top:25px;

    padding:20px;

    background:#030603;

    border-radius:12px;

    border:

    1px solid rgba(255,255,255,.05);

}



/* TICKETS */


.ticket-layout{

    display:grid;

    grid-template-columns:350px 1fr;

    gap:20px;

    margin-top:25px;

}



.ticket-list,
.ticket-view{

    background:#030603;

    border:

    1px solid rgba(0,255,100,.15);

    border-radius:15px;

    padding:20px;

    min-height:500px;

}



.ticket-item{

    padding:15px;

    margin-bottom:10px;

    background:#081108;

    border-radius:10px;

    cursor:pointer;

    border:

    1px solid rgba(255,255,255,.05);

}



.ticket-item:hover{

    border-color:#00ff66;

}



.ticket-item h3{

    color:#00ff66;

    font-size:14px;

}



.ticket-item p{

    color:#aaa;

    font-size:12px;

    margin-top:8px;

}



.ticket-view h2{

    color:#00ff66;

}



@media(max-width:900px){

.layout{

    display:block;

}


.sidebar{

    width:100%;

}


.ticket-layout{

    grid-template-columns:1fr;

}

}



</style>

</head>


<body>


<header>

<div class="logo">
VENSIZ ADMIN
</div>


<div class="admin-info">

🛡 Amir | Owner

</div>


</header>



<div class="layout">


<aside class="sidebar">


<div class="menu-title">

MENU

</div>



<div class="menu">


<button onclick="openSection('tickets')">

🎫 مدیریت تیکت‌ها

</button>



<button onclick="openSection('admins')">

👥 مدیریت ادمین‌ها

</button>



<button onclick="openSection('shop')">

🛒 مدیریت فروشگاه

</button>


</div>


</aside>



<main class="content">


<div id="home" class="dashboard">


<h1>
خوش آمدید
</h1>


<p>
پنل مدیریت VENSIZ
</p>


</div>

<div id="tickets" class="section">


<span class="close" onclick="closeSection('tickets')">
✖
</span>


<h2>
🎫 مدیریت تیکت‌ها
</h2>



<div class="ticket-layout">


<div 
id="ticketList"
class="ticket-list"
>

در حال دریافت تیکت‌ها...

</div>




<div 
id="ticketView"
class="ticket-view"
>

یک تیکت را انتخاب کنید.

</div>



</div>



</div>





<div id="admins" class="section">


<span class="close" onclick="closeSection('admins')">
✖
</span>


<h2>
👥 مدیریت ادمین‌ها
</h2>


<div class="card">

رمز مدیریت ادمین‌ها بعداً اضافه می‌شود.

</div>


</div>





<div id="shop" class="section">


<span class="close" onclick="closeSection('shop')">
✖
</span>


<h2>
🛒 مدیریت فروشگاه
</h2>


<div class="card">

مدیریت فروشگاه بعداً اضافه می‌شود.

</div>


</div>



</main>


</div>





<script>


/* ================================
   SUPABASE
================================ */


const SUPABASE_URL =
"https://gpeckwmjsgklzhtgqdso.supabase.co";


const SUPABASE_KEY =
"sb_publishable_L4G2SJVjpML_5NiKb4tS7A_qXc5MzTZ";



const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);




/* ================================
   OPEN CLOSE SECTION
================================ */


function openSection(id){


document
.getElementById("home")
.style.display="none";



document
.querySelectorAll(".section")
.forEach(
function(section){

section.classList.remove("active");

}

);



document
.getElementById(id)
.classList.add("active");



if(id==="tickets"){

loadAdminTickets();

}


}




function closeSection(id){


document
.getElementById(id)
.classList.remove("active");


document
.getElementById("home")
.style.display="block";


}





/* ================================
   LOAD TICKETS
================================ */


async function loadAdminTickets(){


const list =
document.getElementById(
"ticketList"
);



const {
data,
error
}
=
await db
.from("tickets")
.select("*")
.order(
"created_at",
{
ascending:false
}
);




if(error){


list.innerHTML =
`
خطا در دریافت تیکت‌ها
<br>
${error.message}
`;

console.log(error);

return;

}





if(
!data ||
data.length===0
){


list.innerHTML =
"هنوز تیکتی وجود ندارد";


return;


}





list.innerHTML="";



data.forEach(
function(ticket){



const item =
document.createElement(
"div"
);



item.className =
"ticket-item";



item.innerHTML =
`

<h3>

${ticket.ticket_number}

</h3>


<p>

👤 ${ticket.user_name}

</p>


<p>

📌 ${ticket.subject}

</p>


<p>

📂 ${ticket.department}

</p>


<p>

وضعیت:
${ticket.status}

</p>


`;



item.onclick =
function(){


openAdminTicket(ticket);


};



list.appendChild(item);



});


}




/* ================================
   OPEN TICKET
================================ */


function openAdminTicket(ticket){


const view =
document.getElementById(
"ticketView"
);



view.innerHTML =

`

<h2>

🎫 ${ticket.ticket_number}

</h2>



<div class="card">


<p>

👤 کاربر:

${ticket.user_name}

</p>


<br>


<p>

📌 موضوع:

${ticket.subject}

</p>


<br>


<p>

📂 بخش:

${ticket.department}

</p>


<br>


<p>

📅 تاریخ:

${new Date(ticket.created_at)
.toLocaleString("fa-IR")}

</p>



</div>




<div class="card">


<h3 style="color:#00ff66">

پیام کاربر

</h3>


<br>


<p style="line-height:2">

${escapeHtml(ticket.message)}

</p>



</div>





<div class="card">


<h3 style="color:#00ff66">

چت تیکت

</h3>


<br>


<p style="color:#777">

مرحله بعد: سیستم پاسخ ادمین اضافه می‌شود.

</p>


</div>



`;



}





/* ================================
   SECURITY
================================ */



function escapeHtml(text){


return String(text)

.replaceAll(
"&",
"&amp;"
)

.replaceAll(
"<",
"&lt;"
)

.replaceAll(
">",
"&gt;"
)

.replaceAll(
'"',
"&quot;"
)

.replaceAll(
"'",
"&#039;"
);


}





</script>


</body>

</html>
