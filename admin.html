<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VENSIZ ADMIN</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:tahoma;
}

body{

    background:
    linear-gradient(rgba(0,255,100,.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,255,100,.03) 1px,transparent 1px),
    #020403;

    background-size:50px 50px;

    color:white;
    min-height:100vh;

}


/* HEADER */

header{

    height:75px;

    background:#030603;

    border-bottom:
    1px solid rgba(0,255,100,.15);

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 30px;

}


.logo{

    color:#00ff66;

    font-size:28px;

    font-weight:bold;

    text-shadow:
    0 0 20px #00ff66;

}



.admin-info{

    color:#aaa;

    font-size:13px;

}



/* LAYOUT */


.layout{

    display:flex;

    min-height:calc(100vh - 75px);

}



/* SIDEBAR */


.sidebar{

    width:260px;

    background:#050805;

    border-left:
    1px solid rgba(0,255,100,.15);

    padding:25px;

}



.menu-title{

    color:#00ff66;

    margin-bottom:25px;

    font-size:14px;

}



.menu button{

    width:100%;

    padding:15px;

    margin-bottom:12px;

    background:#081108;

    color:white;

    border:

    1px solid rgba(0,255,100,.15);

    border-radius:12px;

    cursor:pointer;

    text-align:right;

}



.menu button:hover{

    background:
    rgba(0,255,100,.08);

    border-color:#00ff66;

}



/* CONTENT */


.content{

    flex:1;

    padding:35px;

}



.dashboard{

    background:#071008;

    border:

    1px solid rgba(0,255,100,.15);

    border-radius:18px;

    padding:30px;

}



.dashboard h1{

    color:#00ff66;

    margin-bottom:15px;

}



/* SECTIONS */


.section{

    display:none;

    background:#071008;

    border:

    1px solid rgba(0,255,100,.15);

    border-radius:18px;

    padding:25px;

}



.section.active{

    display:block;

}



.close{

    float:left;

    cursor:pointer;

    color:#ff7777;

    font-size:22px;

}



.card{

    margin-top:25px;

    padding:20px;

    background:#030603;

    border-radius:12px;

    border:

    1px solid rgba(255,255,255,.05);

}



</style>

</head>


<body>


<header>


<div class="logo">
VENSIZ ADMIN
</div>


<div class="admin-info">

🛡 Amir | Owner

</div>


</header>




<div class="layout">



<aside class="sidebar">


<div class="menu-title">

MENU

</div>


<div class="menu">


<button onclick="openSection('tickets')">

🎫 مدیریت تیکت‌ها

</button>



<button onclick="openSection('admins')">

👥 مدیریت ادمین‌ها

</button>



<button onclick="openSection('shop')">

🛒 مدیریت فروشگاه

</button>



</div>


</aside>




<main class="content">



<div id="home" class="dashboard">


<h1>
خوش آمدید
</h1>


<p>
به پنل مدیریت VENSIZ خوش آمدید
</p>


<div class="card">

از منوی سمت راست بخش مورد نظر را انتخاب کنید.

</div>


</div>





<div id="tickets" class="section">


<span class="close"
onclick="closeSection('tickets')">

✖

</span>


<h2>

🎫 مدیریت تیکت‌ها

</h2>


<div class="card">

سیستم تیکت اینجا قرار می‌گیرد.

</div>


</div>







<div id="admins" class="section">


<span class="close"
onclick="closeSection('admins')">

✖

</span>


<h2>

👥 مدیریت ادمین‌ها

</h2>


<div class="card">

رمز مدیریت ادمین‌ها اینجا قرار می‌گیرد.

</div>


</div>







<div id="shop" class="section">


<span class="close"
onclick="closeSection('shop')">

✖

</span>


<h2>

🛒 مدیریت فروشگاه

</h2>


<div class="card">

رمز مدیریت فروشگاه اینجا قرار می‌گیرد.

</div>


</div>



</main>


</div>




<script>


function openSection(id){


document
.getElementById("home")
.style.display="none";


document
.querySelectorAll(".section")
.forEach(
x=>x.classList.remove("active")
);



document
.getElementById(id)
.classList.add("active");


}



function closeSection(id){


document
.getElementById(id)
.classList.remove("active");


document
.getElementById("home")
.style.display="block";


}


</script>



</body>

</html>
