<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VENSIZ Support</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
font-family:tahoma;
}

body{

margin:0;
background:#020403;
color:white;

background:
linear-gradient(rgba(0,255,100,.04) 1px,transparent 1px),
linear-gradient(90deg,rgba(0,255,100,.04) 1px,transparent 1px);

background-size:40px 40px;

}


.container{

max-width:850px;
margin:50px auto;
padding:20px;

}


.box{

background:#071008;
padding:30px;
border-radius:20px;
border:1px solid #00ff66;

}



h1{

color:#00ff66;
text-align:center;

}



input,
select,
textarea{

width:100%;
padding:15px;
margin:10px 0 20px;

background:#020403;
border:1px solid #00ff66;
border-radius:10px;

color:white;

}



textarea{

height:150px;

}



button{

width:100%;
padding:15px;

background:#00ff66;

border:0;

border-radius:10px;

font-weight:bold;

cursor:pointer;

}



button:hover{

box-shadow:0 0 20px #00ff66;

}



.ticket{

margin-top:15px;

padding:15px;

background:#020403;

border-radius:12px;

border:1px solid #333;

}



.green{

color:#00ff66;

}


</style>


</head>



<body>


<div class="container">


<div class="box">


<h1>
VENSIZ SUPPORT
</h1>


<label>
نام شما
</label>

<input id="userName"
placeholder="نام داخل سرور">



<label>
بخش
</label>


<select id="department">

<option value="">
انتخاب کنید
</option>

<option>
مدیریت
</option>

<option>
ادمین (پشتیبانی سریع)
</option>

<option>
فروشگاه
</option>

<option>
انتقادات و پیشنهادات
</option>

</select>




<label>
موضوع
</label>


<input id="subject"
placeholder="موضوع تیکت">



<label>
توضیحات
</label>


<textarea id="message"
placeholder="مشکل خود را توضیح دهید"></textarea>




<button id="sendTicket">
ارسال تیکت
</button>


<p id="result"></p>



<hr>



<h2 class="green">
تیکت های شما
</h2>


<div id="tickets">

</div>



</div>

</div>





<script>


const SUPABASE_URL =
"https://gpeckwmjsgklzhtgqdso.supabase.co";


const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdwZWNrd21qc2drbHpodGdxZHNvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwODg2MDYsImV4cCI6MjEwMjY2NDYwNn0.byZ-LzDxa884_yIMYEgh3-kvLH8r1AB5huaNvRRLspw";


const db =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);
db.from("tickets")
.select("id")
.limit(1)
.then(console.log);


let browserId =
localStorage.getItem(
"vensiz_browser_id"
);



if(!browserId){

browserId =
"VZ-"+crypto.randomUUID();


localStorage.setItem(
"vensiz_browser_id",
browserId
);

}





document
.getElementById("sendTicket")
.onclick = async()=>{


let userName =
document.getElementById("userName").value.trim();


let department =
document.getElementById("department").value;


let subject =
document.getElementById("subject").value.trim();


let message =
document.getElementById("message").value.trim();



if(
!userName ||
!department ||
!subject ||
!message
){

result.innerHTML=
"❌ همه موارد را کامل کنید";

return;

}




let number =
"VZ-"+Math.floor(
100000+
Math.random()*900000
);




const {data,error}=

await db

.from("tickets")

.insert({

ticket_number:number,

subject:subject,

message:message,

status:"open",

user_name:userName,

browser_id:browserId,

department:department

})

.select()

.single();





console.log(data,error);





if(error){

result.innerHTML=
"❌ "+error.message;

return;

}



result.innerHTML=
"✅ تیکت ثبت شد : "+number;



loadTickets();



};





async function loadTickets(){


const {data,error}=

await db

.from("tickets")

.select("*")

.eq(
"browser_id",
browserId
)

.order(
"created_at",
{
ascending:false
}
);



if(error){

console.log(error);

return;

}



tickets.innerHTML="";



data.forEach(t=>{


tickets.innerHTML +=

`

<div class="ticket">

<span class="green">
${t.ticket_number}
</span>

<br><br>

موضوع:
${t.subject}

<br>

بخش:
${t.department}

<br>

وضعیت:
${t.status}


<br><br>

<button onclick="openChat('${t.id}')">
💬 ورود به گفتگو
</button>


<button 
style="margin-top:10px;background:#ff4444;color:white"
onclick="deleteTicket('${t.id}')">

🗑 حذف تیکت

</button>


</div>

`;


});


}

function openChat(id){

alert("چت تیکت: "+id);

// مرحله بعد اینجا باکس چت باز می‌شود

}



async function deleteTicket(id){


if(!confirm("آیا مطمئن هستید؟")){
return;
}


const {error}=await db
.from("tickets")
.delete()
.eq("id",id);



if(error){

console.log(error);
return;

}


loadTickets();


}

loadTickets();


</script>


</body>

</html>
