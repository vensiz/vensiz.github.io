<script>


const SUPABASE_URL =
"https://gpeckwmjsgklzhtgqdso.supabase.co";


const SUPABASE_KEY =
"sb_publishable_L4G2SJVjpML_5NiKb4tS7A_qXc5MzTZ";

const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);
db.auth.getSession().then(({data})=>{
    console.log("SESSION:", data);
});


/*
BROWSER ID
*/


function getBrowserId(){


let id =
localStorage.getItem(
"vensiz_browser_id"
);


if(!id){


id =
"VZ-" +
crypto.randomUUID();


localStorage.setItem(
"vensiz_browser_id",
id
);


}


return id;


}


const browserId =
getBrowserId();



let currentTicket=null;

let channel=null;



const sendTicket =
document.getElementById(
"sendTicket"
);


const result =
document.getElementById(
"result"
);


const ticketsBox =
document.getElementById(
"tickets"
);




function showResult(text,type){

result.innerHTML=text;

result.className=
"message "+type;

}




/*
CREATE TICKET
*/


sendTicket.onclick =
async()=>{

alert("دکمه کار کرد");

...

let userName =
document.getElementById("userName")
.value.trim();


let department =
document.getElementById("department")
.value;


let subject =
document.getElementById("subject")
.value.trim();


let message =
document.getElementById("message")
.value.trim();



if(
!userName ||
!department ||
!subject ||
!message
){

showResult(
"لطفا همه بخش‌ها را کامل کنید",
"error"
);

return;

}



sendTicket.disabled=true;



let number =
"VZ-" +
Math.floor(
100000+
Math.random()*900000
);



const {data,error}=

await db
.from("tickets")
.insert({

ticket_number:number,

user_name:userName,

browser_id:browserId,

department:department,

subject:subject,

message:message,

status:"open"

});
.select()
.single();



if(error){

console.log(error);

showResult(
error.message,
"error"
);


sendTicket.disabled=false;

return;

}



showResult(
"✅ تیکت ساخته شد : "+number,
"success"
);



document.getElementById("userName").value="";
document.getElementById("subject").value="";
document.getElementById("message").value="";



sendTicket.disabled=false;



loadTickets();


openTicket(data);


};




/*
==============================
LOAD MESSAGES
==============================
*/


async function loadMessages(ticketId){


const box =
document.getElementById("messages");



const {data,error}=

await db
.from("ticket_messages")
.select("*")
.eq(
"ticket_id",
ticketId
)
.order(
"created_at",
{
ascending:true
}
);



if(error){

box.innerHTML=
"خطا در دریافت پیام‌ها";

return;

}



box.innerHTML="";



if(!data || data.length===0){

box.innerHTML=

`
<div class="msg">
هنوز پیامی وجود ندارد
</div>
`;

return;

}



data.forEach(msg=>{

addMessage(msg);

});


}





/*
==============================
SHOW MESSAGE
==============================
*/


function addMessage(msg){


const box =
document.getElementById("messages");



let div =
document.createElement("div");



div.className=
"msg "+
(
msg.sender_type==="admin"
?
"admin"
:
""
);



div.innerHTML=

`

<div class="msg-name">

${
msg.sender_type==="admin"

?

"🛡 "+msg.sender_name+
" | "+
(msg.sender_rank || "")

:

"👤 "+msg.sender_name

}

</div>


<div class="msg-text">

${escapeHtml(msg.message)}

</div>

`;



box.appendChild(div);



box.scrollTop=
box.scrollHeight;


}







/*
==============================
SEND USER MESSAGE
==============================
*/


document
.getElementById("sendReply")
.onclick=

async()=>{


if(!currentTicket)
return;



let input =
document.getElementById(
"replyMessage"
);



let text =
input.value.trim();



if(!text)
return;



const {error}=

await db
.from("ticket_messages")
.insert({

ticket_id:
currentTicket.id,


sender_type:
"user",


sender_name:
currentTicket.user_name,


sender_rank:null,


message:text

});



if(error){

alert(error.message);

return;

}



input.value="";


await loadMessages(
currentTicket.id
);


};





/*
==============================
REALTIME CHAT
==============================
*/


function startRealtime(ticketId){



if(channel){

db.removeChannel(channel);

}



channel=

db
.channel(
"vensiz-ticket-"+ticketId
)


.on(

"postgres_changes",

{

event:"INSERT",

schema:"public",

table:"ticket_messages",

filter:
"ticket_id=eq."+ticketId

},


(payload)=>{


addMessage(
payload.new
);


}

)


.subscribe();



}




/*
==============================
ESCAPE
==============================
*/


function escapeHtml(text){


return String(text)

.replaceAll("&","&amp;")

.replaceAll("<","&lt;")

.replaceAll(">","&gt;")

.replaceAll('"',"&quot;")

.replaceAll("'","&#039;");


}





/*
START
*/


loadTickets();


</script>
