<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>پشتیبانی | VENSIZ</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;

    background:
        linear-gradient(
            rgba(0,255,100,.02) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(0,255,100,.02) 1px,
            transparent 1px
        ),
        #030604;

    background-size:50px 50px;

    color:#fff;

    font-family:
        Tahoma,
        Arial,
        sans-serif;
}


/* =========================
   HEADER
========================= */

header{

    height:86px;

    border-bottom:
        1px solid
        rgba(0,255,100,.15);

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:
        0 6%;

    background:
        rgba(0,0,0,.5);
}


.logo{

    color:#00ff66;

    font-size:28px;

    font-weight:bold;

    text-shadow:
        0 0 20px
        rgba(0,255,100,.5);
}


nav{

    display:flex;

    gap:30px;

    align-items:center;
}


nav a{

    color:#ddd;

    text-decoration:none;

    font-size:14px;

    transition:.2s;
}


nav a:hover{

    color:#00ff66;

}


/* =========================
   MAIN
========================= */

main{

    max-width:1000px;

    margin:
        90px auto;

    padding:
        0 25px;

    text-align:center;
}


.title{

    font-size:45px;

    margin-bottom:12px;

    text-shadow:
        0 0 30px
        rgba(0,255,100,.35);
}


.title span{

    color:#00ff66;
}


.subtitle{

    color:#888;

    font-size:14px;

    margin-bottom:45px;
}


/* =========================
   AUTH LOADING
========================= */

#loading{

    padding:50px;

    color:#00ff66;

    font-size:16px;
}


/* =========================
   LOGIN REQUIRED
========================= */

#loginRequired{

    display:none;

    padding:50px 30px;

    background:#071008;

    border:
        1px solid
        rgba(0,255,100,.2);

    border-radius:20px;
}


#loginRequired h2{

    color:#00ff66;

    margin-bottom:20px;
}


#loginRequired p{

    color:#999;

    margin-bottom:30px;
}


.button{

    display:inline-block;

    padding:
        14px 30px;

    border-radius:10px;

    background:#00d95a;

    color:#001b08;

    text-decoration:none;

    font-weight:bold;

    transition:.2s;
}


.button:hover{

    background:#00ff66;

    box-shadow:
        0 0 25px
        rgba(0,255,100,.3);
}


/* =========================
   SUPPORT
========================= */

#supportContent{

    display:none;

    text-align:right;
}


.user-box{

    background:#071008;

    border:
        1px solid
        rgba(0,255,100,.15);

    border-radius:16px;

    padding:20px;

    margin-bottom:25px;

    color:#aaa;
}


.user-box strong{

    color:#00ff66;
}


.ticket{

    background:#071008;

    border:
        1px solid
        rgba(0,255,100,.15);

    border-radius:20px;

    padding:30px;
}


.ticket h2{

    color:#00ff66;

    margin-bottom:25px;
}


label{

    display:block;

    color:#aaa;

    margin-bottom:8px;

    font-size:13px;
}


input,
textarea{

    width:100%;

    background:#030604;

    color:#fff;

    border:
        1px solid
        rgba(0,255,100,.15);

    border-radius:10px;

    padding:14px;

    margin-bottom:20px;

    outline:none;

    font-family:Tahoma,Arial,sans-serif;

    direction:rtl;
}


input:focus,
textarea:focus{

    border-color:#00ff66;
}


textarea{

    min-height:160px;

    resize:vertical;
}


.submit{

    width:100%;

    border:none;

    padding:15px;

    border-radius:10px;

    background:#00d95a;

    color:#001b08;

    font-weight:bold;

    cursor:pointer;

    font-family:Tahoma,Arial,sans-serif;
}


.submit:hover{

    background:#00ff66;
}


.message{

    margin-top:20px;

    padding:14px;

    border-radius:10px;

    display:none;

    text-align:center;
}


.success{

    display:block;

    color:#00ff66;

    background:
        rgba(0,255,100,.05);

    border:
        1px solid
        rgba(0,255,100,.15);
}


.error{

    display:block;

    color:#ff7777;

    background:
        rgba(255,0,0,.05);

    border:
        1px solid
        rgba(255,0,0,.15);
}


@media(max-width:700px){

    header{

        padding:0 20px;

    }

    nav{

        gap:12px;

    }

    nav a{

        font-size:11px;

    }

    .title{

        font-size:32px;

    }

}

</style>

</head>


<body>


<header>

    <div class="logo">
        VENSIZ
    </div>

    <nav>

        <a href="index.html">
            خانه
        </a>

        <a href="shop.html">
            فروشگاه
        </a>

        <a href="about.html">
            درباره ما
        </a>

        <a href="download.html">
            دانلود
        </a>

        <a href="updates.html">
            بروزرسانی‌ها
        </a>

        <a href="rules.html">
            قوانین
        </a>

        <a href="support.html">
            پشتیبانی
        </a>

    </nav>

</header>


<main>

    <h1 class="title">
        VENSIZ
        <span>پشتیبانی</span>
    </h1>

    <div class="subtitle">
        VENSIZ SUPPORT CENTER
    </div>


    <!-- LOADING -->

    <div id="loading">

        در حال بررسی حساب کاربری...

    </div>


    <!-- LOGIN REQUIRED -->

    <div id="loginRequired">

        <h2>
            🔐 ابتدا احراز هویت کنید
        </h2>

        <p>
            برای ارسال تیکت پشتیبانی ابتدا باید وارد حساب کاربری خود شوید.
        </p>

        <a
            href="login.html"
            class="button"
        >
            احراز هویت
        </a>

    </div>


    <!-- SUPPORT -->

    <div id="supportContent">

        <div class="user-box">

            حساب وارد شده:

            <strong id="userEmail">
                -
            </strong>

        </div>


        <div class="ticket">

            <h2>
                🎫 ارسال تیکت پشتیبانی
            </h2>


            <label>
                موضوع
            </label>

            <input
                id="subject"
                type="text"
                placeholder="موضوع مشکل"
            >


            <label>
                توضیحات
            </label>

            <textarea
                id="description"
                placeholder="مشکل خود را کامل توضیح دهید..."
            ></textarea>


            <button
                id="submitTicket"
                class="submit"
            >
                ارسال تیکت
            </button>


            <div
                id="message"
                class="message"
            ></div>

        </div>

    </div>

</main>


<script>

/* =========================================
   VENSIZ SUPABASE
========================================= */

const SUPABASE_URL =
"https://gpeckwmjsgklzhtgqdso.supabase.co";

const SUPABASE_KEY =
"sb_publishable_L4G2SJVjpML_5NiKb4tS7A_qXc5MzTZ";


/* =========================================
   IMPORTANT:
   SAME STORAGE KEY AS LOGIN.HTML
========================================= */

const supabaseClient =
window.supabase.createClient(

    SUPABASE_URL,

    SUPABASE_KEY,

    {

        auth:{

            persistSession:true,

            autoRefreshToken:true,

            detectSessionInUrl:true,

            storageKey:
                "vensiz-auth-session"

        }

    }

);


/* =========================================
   ELEMENTS
========================================= */

const loading =
document.getElementById("loading");

const loginRequired =
document.getElementById("loginRequired");

const supportContent =
document.getElementById("supportContent");

const userEmail =
document.getElementById("userEmail");

const submitTicket =
document.getElementById("submitTicket");

const message =
document.getElementById("message");


/* =========================================
   SHOW LOGIN
========================================= */

function showLogin(){

    loading.style.display =
        "none";

    supportContent.style.display =
        "none";

    loginRequired.style.display =
        "block";
}


/* =========================================
   SHOW SUPPORT
========================================= */

function showSupport(user){

    loading.style.display =
        "none";

    loginRequired.style.display =
        "none";

    supportContent.style.display =
        "block";

    userEmail.textContent =
        user.email || "کاربر";
}


/* =========================================
   CHECK AUTH
========================================= */

async function checkAuthentication(){

    try{

        console.log(
            "VENSIZ AUTH: checking session..."
        );


        /*
         مهم:
         مستقیماً منتظر getSession می‌مانیم.
        */

        const {
            data,
            error
        } =
        await supabaseClient.auth.getSession();


        if(error){

            console.error(
                "SESSION ERROR:",
                error
            );

            showLogin();

            return;
        }


        const session =
            data.session;


        console.log(
            "VENSIZ SESSION:",
            session
        );


        if(session && session.user){

            console.log(
                "VENSIZ USER:",
                session.user.email
            );

            showSupport(
                session.user
            );

        }else{

            showLogin();

        }

    }catch(error){

        console.error(
            "AUTH CHECK ERROR:",
            error
        );

        showLogin();

    }

}


/* =========================================
   AUTH STATE LISTENER
========================================= */

supabaseClient.auth.onAuthStateChange(

    function(event,session){

        console.log(
            "AUTH EVENT:",
            event
        );


        if(session && session.user){

            showSupport(
                session.user
            );

        }

    }

);


/* =========================================
   START AUTH CHECK
========================================= */

checkAuthentication();


/* =========================================
   SEND TICKET
========================================= */

submitTicket.addEventListener(
    "click",
    async function(){

        message.className =
            "message";

        message.style.display =
            "none";


        const subject =
            document.getElementById(
                "subject"
            ).value.trim();


        const description =
            document.getElementById(
                "description"
            ).value.trim();


        if(!subject || !description){

            message.textContent =
                "موضوع و توضیحات را وارد کنید.";

            message.className =
                "message error";

            return;
        }


        submitTicket.disabled =
            true;


        try{

            /*
             دوباره سشن را می‌گیریم
             تا مطمئن شویم کاربر هنوز وارد است.
            */

            const {
                data,
                error
            } =
            await supabaseClient.auth.getSession();


            if(error || !data.session){

                message.textContent =
                    "جلسه ورود شما منقضی شده است. دوباره وارد شوید.";

                message.className =
                    "message error";

                setTimeout(function(){

                    window.location.href =
                        "login.html";

                },1500);

                return;
            }


            const user =
                data.session.user;


            /*
             INSERT
            */

            const result =
            await supabaseClient
                .from("tickets")
                .insert({

                    user_id:user.id,

                    subject:subject,

                    description:description

                });


            if(result.error){

                console.error(
                    "TICKET ERROR:",
                    result.error
                );

                message.textContent =
                    result.error.message;

                message.className =
                    "message error";

                return;
            }


            message.textContent =
                "تیکت شما با موفقیت ارسال شد.";

            message.className =
                "message success";


            document.getElementById(
                "subject"
            ).value = "";


            document.getElementById(
                "description"
            ).value = "";


        }catch(error){

            console.error(error);

            message.textContent =
                "خطایی هنگام ارسال تیکت رخ داد.";

            message.className =
                "message error";

        }finally{

            submitTicket.disabled =
                false;

        }

    }
);

</script>

</body>

</html>
