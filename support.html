<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VENSIZ Support</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
background:#020403;
color:white;
font-family:tahoma;
padding:30px;
}

.box{

max-width:700px;
margin:auto;
background:#071008;
padding:25px;
border-radius:15px;
border:1px solid #00ff66;

}

h1,h2{

color:#00ff66;

}

input,textarea,select{

width:100%;
padding:12px;
margin:10px 0;
background:#020403;
color:white;
border:1px solid #00ff66;
border-radius:8px;

}


textarea{

height:120px;

}


button{

width:100%;
padding:15px;
background:#00ff66;
border:0;
border-radius:8px;
font-weight:bold;
cursor:pointer;

}


.ticket{

margin-top:15px;
padding:15px;
background:#020403;
border-radius:10px;

}


</style>

</head>


<body>


<div class="box">


<h1>
VENSIZ Support
</h1>


<h2>
ارسال تیکت
</h2>


<input id="userName" placeholder="نام شما">


<select id="department">

<option value="">
انتخاب بخش
</option>

<option>
مدیریت ادمین
</option>

<option>
فروشگاه
</option>

<option>
شکایت
</option>

</select>


<input id="subject" placeholder="موضوع">


<textarea id="message" placeholder="مشکل خود را بنویسید"></textarea>


<button id="send">

ارسال تیکت

</button>


<p id="result"></p>


<hr>


<h2>
تیکت های من
</h2>


<div id="list">

</div>


</div>



<script>


const URL =
"https://gpeckwmjsgklzhtgqdso.supabase.co";


const KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdwZWNrd21qc2drbHpodGdxZHNvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwODg2MDYsImV4cCI6MjEwMjY2NDYwNn0.byZ-LzDxa884_yIMYEgh3-kvLH8r1AB5huaNvRRLspw";


const db =
supabase.createClient(
URL,
KEY
);



let browserId =
localStorage.getItem("vensiz_id");


if(!browserId){

browserId =
"VZ-"+crypto.randomUUID();

localStorage.setItem(
"vensiz_id",
browserId
);

}




const btn =
document.getElementById("send");


const result =
document.getElementById("result");


btn.onclick = async()=>{


let userName =
document.getElementById("userName").value;


let department =
document.getElementById("department").value;


let subject =
document.getElementById("subject").value;


let message =
document.getElementById("message").value;



if(
!userName ||
!department ||
!subject ||
!message
){

result.innerHTML="همه موارد را پر کنید";

return;

}



let number =
"VZ-"+Math.floor(
100000+Math.random()*900000
);



let {data,error}=

await db
.from("tickets")
.insert({

ticket_number:number,

user_name:userName,

browser_id:browserId,

department:department,

subject:subject,

message:message,

status:"open"

})
.select()
.single();



console.log(data,error);



if(error){

result.innerHTML=
error.message;

return;

}



result.innerHTML=
"تیکت ثبت شد : "+number;


load();


};





async function load(){


let {data,error}=

await db
.from("tickets")
.select("*")
.eq(
"browser_id",
browserId
)
.order(
"created_at",
{
ascending:false
}
);



let box =
document.getElementById("list");


box.innerHTML="";


if(error){

box.innerHTML=error.message;

return;

}



data.forEach(t=>{


box.innerHTML +=

`

<div class="ticket">

<b>${t.ticket_number}</b>

<br>

${t.subject}

<br>

وضعیت:
${t.status}

</div>

`;


});


}


load();


</script>


</body>

</html>
