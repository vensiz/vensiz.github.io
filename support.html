<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VENSIZ Support</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
font-family:tahoma,Arial;
}


body{

margin:0;

background:#020403;

color:white;

background:

linear-gradient(
rgba(0,255,100,.04) 1px,
transparent 1px
),

linear-gradient(
90deg,
rgba(0,255,100,.04) 1px,
transparent 1px
);

background-size:40px 40px;

}



.container{

max-width:850px;

margin:50px auto;

padding:20px;

}



.box{

background:#071008;

padding:30px;

border-radius:20px;

border:1px solid rgba(0,255,100,.25);

box-shadow:
0 0 30px rgba(0,255,100,.08);

}



h1{

color:#00ff66;

text-align:center;

font-size:32px;

text-shadow:
0 0 15px #00ff66;

}



h2{

margin-top:20px;

}



.green{

color:#00ff66;

}



input,
select,
textarea{

width:100%;

padding:15px;

margin:10px 0 20px;

background:#020403;

border:1px solid rgba(0,255,100,.5);

border-radius:12px;

color:white;

outline:none;

}



input:focus,
select:focus,
textarea:focus{

box-shadow:
0 0 15px rgba(0,255,100,.4);

border-color:#00ff66;

}



textarea{

height:150px;

resize:none;

}



button{

width:100%;

padding:15px;

background:#00ff66;

border:0;

border-radius:12px;

font-weight:bold;

cursor:pointer;

color:#001b08;

transition:.3s;

}



button:hover{

box-shadow:
0 0 20px #00ff66;

transform:translateY(-2px);

}



.ticket{

margin-top:15px;

padding:20px;

background:#030603;

border-radius:15px;

border:1px solid rgba(0,255,100,.15);

}



.chat-box{

margin-top:30px;

background:#071008;

padding:25px;

border-radius:20px;

border:1px solid rgba(0,255,100,.25);

box-shadow:
0 0 30px rgba(0,255,100,.08);

}



.chat-title{

color:#00ff66;

font-size:22px;

margin-bottom:20px;

}



.chat-message{

background:#030603;

border:1px solid rgba(0,255,100,.15);

padding:15px;

border-radius:15px;

margin-bottom:12px;

}



.user-message{

border-right:4px solid #00ff66;

}



.admin-message{

border-left:4px solid #00ff66;

}



.chat-code{

color:#aaa;

line-height:2;

background:#020403;

padding:15px;

border-radius:12px;

margin-bottom:20px;

}



.chat-send{

display:flex;

gap:10px;

}



.chat-send textarea{

height:100px;

}



.delete-btn{

background:#ff4444;

color:white;

}



.chat-btn{

background:#00ff66;

color:#001b08;

}


hr{

border:0;

border-top:1px solid rgba(0,255,100,.2);

margin:30px 0;

}


</style>

</head>



<body>


<div class="container">


<div class="box">


<h1>
VENSIZ SUPPORT
</h1>


<label>
نام شما
</label>

<input id="userName"
placeholder="نام داخل سرور">



<label>
بخش
</label>


<select id="department">

<option value="">
انتخاب کنید
</option>

<option>
مدیریت
</option>

<option>
ادمین (پشتیبانی سریع)
</option>

<option>
فروشگاه
</option>

<option>
انتقادات و پیشنهادات
</option>

</select>




<label>
موضوع
</label>


<input id="subject"
placeholder="موضوع تیکت">



<label>
توضیحات
</label>


<textarea id="message"
placeholder="مشکل خود را توضیح دهید"></textarea>




<button id="sendTicket">
ارسال تیکت
</button>


<p id="result"></p>



<hr>



<h2 class="green">
تیکت های شما
</h2>


<div id="tickets">

</div>

<div id="chatBox" class="chat-box" style="display:none;">

<h2 class="green">
💬 گفتگوی تیکت
</h2>

<div id="chatInfo" class="ticket"></div>

<div id="messages"></div>


<textarea 
id="chatMessage"
placeholder="پیام خود را بنویسید">
</textarea>


<button onclick="sendMessage()">
ارسال پیام
</button>


</div>

</div>

</div>





<script>


const SUPABASE_URL =
"https://gpeckwmjsgklzhtgqdso.supabase.co";


const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdwZWNrd21qc2drbHpodGdxZHNvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwODg2MDYsImV4cCI6MjEwMjY2NDYwNn0.byZ-LzDxa884_yIMYEgh3-kvLH8r1AB5huaNvRRLspw";


const db =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);
db.from("tickets")
.select("id")
.limit(1)
.then(console.log);


let browserId =
localStorage.getItem(
"vensiz_browser_id"
);



if(!browserId){

browserId =
"VZ-"+crypto.randomUUID();


localStorage.setItem(
"vensiz_browser_id",
browserId
);

}





document
.getElementById("sendTicket")
.onclick = async()=>{


let userName =
document.getElementById("userName").value.trim();


let department =
document.getElementById("department").value;


let subject =
document.getElementById("subject").value.trim();


let message =
document.getElementById("message").value.trim();



if(
!userName ||
!department ||
!subject ||
!message
){

result.innerHTML=
"❌ همه موارد را کامل کنید";

return;

}




let number =
"VZ-"+Math.floor(
100000+
Math.random()*900000
);




const {data,error}=

await db

.from("tickets")

.insert({

ticket_number:number,

subject:subject,

message:message,

status:"open",

user_name:userName,

browser_id:browserId,

department:department

})

.select()

.single();





console.log(data,error);





if(error){

result.innerHTML=
"❌ "+error.message;

return;

}



result.innerHTML=
"✅ تیکت ثبت شد : "+number;



loadTickets();



};





async function loadTickets(){


const {data,error}=

await db

.from("tickets")

.select("*")

.eq(
"browser_id",
browserId
)

.order(
"created_at",
{
ascending:false
}
);



if(error){

console.log(error);

return;

}



tickets.innerHTML="";



data.forEach(t=>{


tickets.innerHTML +=

`

<div class="ticket">

<strong class="green">
${t.ticket_number}
</strong>

<br><br>

موضوع:
${t.subject}

<br>

بخش:
${t.department}

<br>

وضعیت:
${t.status}


<br><br>

<button onclick="openChat('${t.id}')">
💬 ورود به گفتگو
</button>


<button 
style="margin-top:10px;background:#ff4444;color:white"
onclick="deleteTicket('${t.id}')">

🗑 حذف تیکت

</button>


</div>

`;


});


}

let currentTicket = null;


async function openChat(id){

    currentTicket = id;

    const chatBox = document.getElementById("chatBox");

    chatBox.style.display = "block";

    chatBox.scrollIntoView({
        behavior: "smooth",
        block: "start"
    });

    const { data, error } = await db
        .from("tickets")
        .select("*")
        .eq("id", id)
        .single();

    if(error){

        console.log("OPEN CHAT ERROR:", error);

        document.getElementById("chatInfo").innerHTML =
        "❌ خطا در دریافت اطلاعات تیکت";

        return;
    }

    document.getElementById("chatInfo").innerHTML = `

        <strong class="green">
        🎫 ${data.ticket_number}
        </strong>

        <br><br>

        👤 کاربر:
        ${data.user_name || "-"}

        <br>

        📌 موضوع:
        ${data.subject || "-"}

        <br>

        📂 بخش:
        ${data.department || "-"}

        <br>

        📊 وضعیت:
        ${data.status || "-"}

    `;

    await loadMessages();

}
async function loadMessages(){


const {data,error}=await db

.from("ticket_messages")

.select("*")

.eq(
"ticket_id",
currentTicket
)

.order(
"created_at",
{
ascending:true
}
);



if(error){

console.log(error);
return;

}



const box=document.getElementById("messages");

box.innerHTML="";



data.forEach(msg=>{


box.innerHTML += `

<div class="chat-message">


<span class="green">
${msg.sender_name}
</span>

<br>

${msg.message}


</div>


`;



});


}
async function sendMessage(){


let text =
document
.getElementById("chatMessage")
.value
.trim();



if(!text || !currentTicket){

return;

}



const {error}=await db
.from("ticket_messages")
.insert({

ticket_id:currentTicket,

sender_type:"user",

sender_name:
"کاربر",

message:text

});



if(error){

console.log(error);
return;

}



document
.getElementById("chatMessage")
.value="";


loadMessages();


}
async function deleteTicket(id){


if(!confirm("آیا مطمئن هستید؟")){
return;
}


const {error}=await db
.from("tickets")
.delete()
.eq("id",id);



if(error){

console.log(error);
return;

}


loadTickets();


}

loadTickets();


</script>


</body>

</html>
