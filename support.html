<!-- ================= SUPABASE ================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://gpeckwmjsgklzhtgqdso.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_L4G2SJVjpML_5NiKb4tS7A_qXc5MzTZ";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY,
    {
        auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
        }
    }
);


/* =========================
   AUTH CHECK
========================= */

async function checkAuth(){

    const authBox =
        document.getElementById("authBox");

    const ticketArea =
        document.getElementById("ticketArea");

    const userEmail =
        document.getElementById("userEmail");


    const {
        data: { session },
        error
    } =
    await supabaseClient.auth.getSession();


    console.log("VENSIZ SESSION:", session);
    console.log("VENSIZ AUTH ERROR:", error);


    if(!session){

        authBox.style.display = "block";
        ticketArea.style.display = "none";

        return;
    }


    /* کاربر وارد شده */

    authBox.style.display = "none";

    ticketArea.style.display = "block";

    userEmail.textContent =
        session.user.email || "کاربر VENSIZ";
}


/* =========================
   AUTH STATE
========================= */

supabaseClient.auth.onAuthStateChange(
    (event, session) => {

        console.log(
            "AUTH EVENT:",
            event,
            session
        );

        const authBox =
            document.getElementById("authBox");

        const ticketArea =
            document.getElementById("ticketArea");

        const userEmail =
            document.getElementById("userEmail");


        if(session){

            authBox.style.display = "none";

            ticketArea.style.display = "block";

            userEmail.textContent =
                session.user.email || "کاربر VENSIZ";

        }else{

            authBox.style.display = "block";

            ticketArea.style.display = "none";

        }

    }
);


/* =========================
   SEND TICKET
========================= */

document
.getElementById("submitTicket")
.addEventListener("click", async function(){

    const subject =
        document
        .getElementById("subject")
        .value
        .trim();


    const message =
        document
        .getElementById("message")
        .value
        .trim();


    const result =
        document
        .getElementById("ticketMessage");


    if(!subject){

        result.textContent =
        "لطفاً موضوع تیکت را وارد کنید.";

        return;
    }


    if(!message){

        result.textContent =
        "لطفاً متن درخواست را وارد کنید.";

        return;
    }


    const {
        data: { session }
    } =
    await supabaseClient.auth.getSession();


    if(!session){

        result.textContent =
        "ابتدا احراز هویت کنید.";

        return;
    }


    const { error } =
    await supabaseClient
    .from("tickets")
    .insert({

        user_id: session.user.id,

        subject: subject,

        message: message

    });


    if(error){

        console.error(
            "TICKET ERROR:",
            error
        );

        result.textContent =
        "خطا در ارسال تیکت: " +
        error.message;

        return;
    }


    result.textContent =
    "تیکت شما با موفقیت ارسال شد. ✅";


    document.getElementById("subject").value = "";

    document.getElementById("message").value = "";

});


/* =========================
   START
========================= */

checkAuth();

</script>

</body>
</html>
