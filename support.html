<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VENSIZ | Support</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:tahoma;
}


body{

background:
linear-gradient(rgba(0,255,100,.03) 1px,transparent 1px),
linear-gradient(90deg,rgba(0,255,100,.03) 1px,transparent 1px),
#020403;

background-size:50px 50px;

color:white;

min-height:100vh;

}


header{

height:80px;

background:#030603;

border-bottom:1px solid rgba(0,255,100,.2);

display:flex;

align-items:center;

justify-content:space-between;

padding:0 40px;

}


.logo{

font-size:30px;

font-weight:bold;

color:#00ff66;

text-shadow:0 0 20px #00ff66;

}



main{

max-width:900px;

margin:50px auto;

padding:20px;

}



.box{

background:#071008;

border:1px solid rgba(0,255,100,.15);

border-radius:18px;

padding:25px;

margin-bottom:25px;

}



h1,h2{

color:#00ff66;

margin-bottom:20px;

}



input,
textarea,
select{

width:100%;

background:#030603;

border:1px solid rgba(0,255,100,.2);

color:white;

padding:14px;

border-radius:10px;

margin-bottom:15px;

}


textarea{

height:140px;

resize:none;

}



button{

width:100%;

padding:15px;

background:#00ff66;

border:none;

border-radius:10px;

font-weight:bold;

cursor:pointer;

}



button:hover{

box-shadow:0 0 20px #00ff66;

}



.ticket{

background:#030603;

border:1px solid rgba(255,255,255,.08);

padding:15px;

border-radius:12px;

margin-top:15px;

}



.ticket h3{

color:#00ff66;

}



.small{

color:#888;

font-size:13px;

}



#result{

margin-top:15px;

text-align:center;

}


</style>

</head>
<body>


<header>

<div class="logo">
VENSIZ
</div>


<div>
Support Center
</div>


</header>



<main>


<div class="box">


<h1>
🎫 ارسال تیکت
</h1>


<input id="userName"
placeholder="نام شما در سرور">



<select id="department">

<option value="">
انتخاب بخش
</option>

<option value="مدیریت ادمین">
مدیریت ادمین
</option>

<option value="فروشگاه">
فروشگاه
</option>

<option value="انتقادات و شکایات">
انتقادات و شکایات
</option>

</select>



<input id="subject"
placeholder="موضوع تیکت">



<textarea id="message"
placeholder="توضیحات مشکل"></textarea>



<button id="sendTicket">
ارسال تیکت
</button>



<div id="result"></div>


</div>





<div class="box">


<h2>
📋 تیکت‌های من
</h2>


<div id="tickets">

در حال دریافت...

</div>


</div>


</main>



<script>


const SUPABASE_URL =
"https://gpeckwmjsgklzhtgqdso.supabase.co";


const SUPABASE_KEY =
"sb_publishable_L4G2SJVjpML_5NiKb4tS7A_qXc5MzTZ";


const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



function getBrowserId(){


let id =
localStorage.getItem(
"vensiz_browser_id"
);



if(!id){


id =
"VZ-" +
crypto.randomUUID();



localStorage.setItem(
"vensiz_browser_id",
id
);


}


return id;


}



const browserId =
getBrowserId();



const sendTicket =
document.getElementById(
"sendTicket"
);



const result =
document.getElementById(
"result"
);



const ticketsBox =
document.getElementById(
"tickets"
);



function showResult(text){


result.innerHTML=text;


}



sendTicket.onclick =
async()=>{


let userName =
document
.getElementById("userName")
.value.trim();



let department =
document
.getElementById("department")
.value;



let subject =
document
.getElementById("subject")
.value.trim();



let message =
document
.getElementById("message")
.value.trim();



if(
!userName ||
!department ||
!subject ||
!message
){


showResult(
"❌ همه بخش‌ها را کامل کنید"
);


return;

}



sendTicket.disabled=true;



let number =
"VZ-" +
Math.floor(
100000+
Math.random()*900000
);



const {data,error}=

await db

.from("tickets")

.insert({

ticket_number:number,

user_name:userName,

browser_id:browserId,

department:department,

subject:subject,

message:message,

status:"open"

})

.select()

.single();



if(error){


console.log(error);


showResult(
"❌ "+error.message
);


sendTicket.disabled=false;


return;


}



showResult(
"✅ تیکت ساخته شد : "+number
);



document
.getElementById("userName")
.value="";


document
.getElementById("subject")
.value="";


document
.getElementById("message")
.value="";



loadTickets();



sendTicket.disabled=false;



};
async function loadTickets(){


const {data,error}=

await db

.from("tickets")

.select("*")

.eq(
"browser_id",
browserId
)

.order(
"created_at",
{
ascending:false
}
);



if(error){


ticketsBox.innerHTML =
"❌ خطا در دریافت تیکت‌ها";


console.log(error);


return;


}



if(!data || data.length===0){


ticketsBox.innerHTML =
"هنوز تیکتی ثبت نکرده‌اید";


return;


}



ticketsBox.innerHTML="";



data.forEach(ticket=>{


let div =
document.createElement("div");



div.className="ticket";



div.innerHTML=

`

<h3>
${ticket.ticket_number}
</h3>


<p>
${ticket.subject}
</p>


<div class="small">

بخش:
${ticket.department}

<br>

وضعیت:
${ticket.status}

<br>

تاریخ:
${ticket.created_at}

</div>

`;



ticketsBox.appendChild(div);



});


}




loadTickets();



</script>


</body>

</html>
