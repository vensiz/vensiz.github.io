<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VENSIZ | Support Center</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:tahoma;
}


body{

min-height:100vh;

background:
linear-gradient(rgba(0,255,100,.04) 1px,transparent 1px),
linear-gradient(90deg,rgba(0,255,100,.04) 1px,transparent 1px),
#020403;

background-size:40px 40px;

color:white;

}



header{

height:90px;

display:flex;

justify-content:space-between;

align-items:center;

padding:0 8%;

background:#030603;

border-bottom:1px solid rgba(0,255,100,.2);

}



.logo{

font-size:35px;

font-weight:bold;

color:#00ff66;

text-shadow:0 0 20px #00ff66;

}



main{

max-width:900px;

margin:50px auto;

padding:20px;

}



.card{

background:rgba(7,16,8,.95);

border:1px solid rgba(0,255,100,.18);

border-radius:20px;

padding:30px;

margin-bottom:25px;

box-shadow:0 0 30px rgba(0,255,100,.05);

}



.title{

color:#00ff66;

font-size:32px;

margin-bottom:20px;

}



label{

display:block;

color:#aaa;

margin-bottom:8px;

}



input,
select,
textarea{

width:100%;

background:#020403;

color:white;

border:1px solid rgba(0,255,100,.2);

border-radius:12px;

padding:15px;

margin-bottom:18px;

}



textarea{

height:160px;

resize:none;

}



button{

width:100%;

padding:16px;

border:0;

border-radius:12px;

background:#00ff66;

font-weight:bold;

font-size:16px;

cursor:pointer;

transition:.3s;

}



button:hover{

box-shadow:0 0 25px #00ff66;

}



#result{

text-align:center;

margin-top:15px;

color:#00ff66;

}



.ticket{

background:#020403;

border:1px solid rgba(255,255,255,.1);

padding:18px;

border-radius:15px;

margin-top:15px;

}



.ticket b{

color:#00ff66;

}


</style>

</head>
<body>


<header>

<div class="logo">
VENSIZ
</div>

<div>
SUPPORT CENTER
</div>

</header>



<main>



<div class="card">


<div class="title">
🎫 ارسال تیکت جدید
</div>



<label>
نام شما در سرور
</label>

<input id="userName"
placeholder="مثلا Amir VENSIZ">



<label>
بخش پشتیبانی
</label>


<select id="department">


<option value="">
انتخاب بخش
</option>


<option value="مدیریت">
مدیریت
</option>


<option value="ادمین (پشتیبانی سریع)">
ادمین (پشتیبانی سریع)
</option>


<option value="فروشگاه">
فروشگاه
</option>


<option value="انتقادات و پیشنهادات">
انتقادات و پیشنهادات
</option>


</select>




<label>
موضوع
</label>

<input id="subject"
placeholder="موضوع تیکت">





<label>
توضیحات
</label>


<textarea id="message"
placeholder="مشکل یا درخواست خود را کامل توضیح دهید..."></textarea>




<button id="sendTicket">

ارسال تیکت

</button>


<div id="result"></div>



</div>





<div class="card">


<div class="title">
📋 تیکت‌های من
</div>



<div id="tickets">

در حال دریافت...

</div>



</div>




</main>





<script>


const SUPABASE_URL =
"https://gpeckwmjsgklzhtgqdso.supabase.co";


const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdwZWNrd21qc2drbHpodGdxZHNvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwODg2MDYsImV4cCI6MjEwMjY2NDYwNn0.byZ-LzDxa884_yIMYEgh3-kvLH8r1AB5huaNvRRLspw";


const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



let browserId =
localStorage.getItem(
"vensiz_browser_id"
);



if(!browserId){

browserId =
"VZ-" +
crypto.randomUUID();


localStorage.setItem(
"vensiz_browser_id",
browserId
);

}




const sendTicket =
document.getElementById(
"sendTicket"
);



const result =
document.getElementById(
"result"
);



const ticketsBox =
document.getElementById(
"tickets"
);





sendTicket.onclick =
async()=>{


let userName =
document.getElementById(
"userName"
).value.trim();



let department =
document.getElementById(
"department"
).value;



let subject =
document.getElementById(
"subject"
).value.trim();



let message =
document.getElementById(
"message"
).value.trim();





if(
!userName ||
!department ||
!subject ||
!message
){

result.innerHTML =
"❌ همه بخش‌ها را کامل کنید";

return;

}




sendTicket.disabled=true;




let number =
"VZ-" +
Math.floor(
100000+
Math.random()*900000
);





const {data,error}=

await db

.from("tickets")

.insert({

ticket_number:number,

user_name:userName,

browser_id:browserId,

department:department,

subject:subject,

message:message,

status:"open"

})

.select()

.single();





console.log(
data,
error
);





if(error){


result.innerHTML =
"❌ "+error.message;


sendTicket.disabled=false;


return;


}




result.innerHTML =
"✅ تیکت ثبت شد : "+number;




document.getElementById("userName").value="";
document.getElementById("subject").value="";
document.getElementById("message").value="";



loadTickets();



sendTicket.disabled=false;



};

async function loadTickets(){


const {data,error}=

await db

.from("tickets")

.select("*")

.eq(
"browser_id",
browserId
)

.order(
"created_at",
{
ascending:false
}
);





if(error){

ticketsBox.innerHTML =
"❌ خطا در دریافت تیکت‌ها";

console.log(error);

return;

}





if(!data || data.length===0){

ticketsBox.innerHTML =
"هنوز تیکتی ثبت نکرده‌اید";

return;

}





ticketsBox.innerHTML="";





data.forEach(ticket=>{


let div =
document.createElement("div");



div.className =
"ticket";



div.innerHTML =

`

<b>
${ticket.ticket_number}
</b>

<br><br>

موضوع:
${ticket.subject}

<br>

بخش:
${ticket.department}

<br>

وضعیت:
${ticket.status}

<br>

تاریخ:
${new Date(ticket.created_at).toLocaleString("fa-IR")}

`;



ticketsBox.appendChild(div);



});



}




loadTickets();



</script>


</body>


</html>
