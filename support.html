<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VENSIZ | پشتیبانی</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#050805;
    color:#fff;
    font-family:Tahoma,Arial,sans-serif;
    min-height:100vh;
}

header{
    height:80px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 6%;
    background:rgba(3,8,4,.95);
    border-bottom:1px solid rgba(0,255,100,.15);
    backdrop-filter:blur(15px);
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    color:#00ff66;
    text-decoration:none;
    font-size:28px;
    font-weight:bold;
    text-shadow:0 0 20px rgba(0,255,100,.7);
}

.logo-box{
    width:42px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:2px solid #00ff66;
    border-radius:10px;
    box-shadow:
        0 0 15px rgba(0,255,100,.5),
        inset 0 0 15px rgba(0,255,100,.15);
}

nav{
    display:flex;
    gap:28px;
}

nav a{
    color:#ddd;
    text-decoration:none;
    font-size:14px;
}

nav a:hover{
    color:#00ff66;
}

.container{
    max-width:900px;
    margin:0 auto;
    padding:100px 20px;
}

.title{
    text-align:center;
    margin-bottom:50px;
}

.title h1{
    font-size:42px;
    margin-bottom:12px;
}

.title span{
    color:#00ff66;
    font-size:14px;
}

.card{
    background:#0a110b;
    border:1px solid rgba(0,255,100,.15);
    border-radius:16px;
    padding:35px;
    box-shadow:0 0 40px rgba(0,0,0,.35);
}

.user-box{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    padding:15px 20px;
    margin-bottom:25px;
    background:#071009;
    border:1px solid rgba(0,255,100,.12);
    border-radius:10px;
}

.status{
    display:flex;
    align-items:center;
    gap:8px;
    color:#aaa;
    font-size:13px;
}

.dot{
    width:9px;
    height:9px;
    background:#00ff66;
    border-radius:50%;
    box-shadow:0 0 12px #00ff66;
}

.email{
    color:#00ff66;
    direction:ltr;
}

label{
    display:block;
    margin-bottom:8px;
    color:#aaa;
    font-size:13px;
}

input,
textarea{
    width:100%;
    padding:14px;
    margin-bottom:20px;
    background:#050805;
    border:1px solid rgba(0,255,100,.15);
    border-radius:8px;
    color:white;
    outline:none;
    font-family:Tahoma,Arial,sans-serif;
}

input:focus,
textarea:focus{
    border-color:#00ff66;
    box-shadow:0 0 15px rgba(0,255,100,.1);
}

textarea{
    min-height:180px;
    resize:vertical;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:8px;
    background:#00c853;
    color:#001b08;
    font-weight:bold;
    font-size:15px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#00ff66;
    box-shadow:0 0 25px rgba(0,255,100,.3);
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.message{
    padding:20px;
    border-radius:10px;
    text-align:center;
    line-height:2;
}

.login-message{
    background:#0a110b;
    border:1px solid rgba(0,255,100,.15);
}

.login-message h2{
    color:#00ff66;
    margin-bottom:15px;
}

.auth-btn{
    display:inline-block;
    margin-top:20px;
    padding:13px 30px;
    border-radius:8px;
    background:#00c853;
    color:#001b08;
    text-decoration:none;
    font-weight:bold;
}

.success{
    background:rgba(0,200,83,.08);
    border:1px solid rgba(0,255,100,.3);
    color:#00ff66;
}

.error{
    background:rgba(255,50,50,.08);
    border:1px solid rgba(255,50,50,.25);
    color:#ff7777;
}

.hidden{
    display:none;
}

.ticket{
    margin-top:25px;
    padding:20px;
    background:#071009;
    border:1px solid rgba(0,255,100,.1);
    border-radius:10px;
}

.ticket h3{
    color:#00ff66;
    margin-bottom:10px;
}

.ticket p{
    color:#aaa;
    line-height:1.8;
}

@media(max-width:700px){

    header{
        padding:0 20px;
    }

    nav{
        display:none;
    }

    .container{
        padding:60px 15px;
    }

    .title h1{
        font-size:32px;
    }

    .card{
        padding:20px;
    }

    .user-box{
        flex-direction:column;
        align-items:flex-start;
    }
}
</style>
</head>

<body>

<header>

<a href="index.html" class="logo">
    <div class="logo-box">V</div>
    VENSIZ
</a>

<nav>
    <a href="rules.html">قوانین</a>
    <a href="updates.html">بروزرسانی‌ها</a>
    <a href="download.html">دانلود</a>
    <a href="about.html">درباره ما</a>
    <a href="shop.html">فروشگاه</a>
    <a href="support.html">پشتیبانی</a>
</nav>

</header>


<div class="container">

<div class="title">
    <h1>پشتیبانی VENSIZ</h1>
    <span>VENSIZ SUPPORT CENTER</span>
</div>


<!-- پیام ورود -->

<div id="loginBox" class="message login-message hidden">

    <h2>🔐 ابتدا احراز هویت کنید</h2>

    <p>
        برای ارسال تیکت پشتیبانی باید ابتدا وارد حساب کاربری خود شوید.
    </p>

    <a href="login.html" class="auth-btn">
        احراز هویت
    </a>

</div>


<!-- پنل پشتیبانی -->

<div id="supportBox" class="card hidden">

    <div class="user-box">

        <div class="status">
            <div class="dot"></div>
            احراز هویت شده
        </div>

        <div id="userEmail" class="email">
            -
        </div>

    </div>


    <form id="ticketForm">

        <label for="subject">
            موضوع تیکت
        </label>

        <input
            id="subject"
            type="text"
            placeholder="موضوع مشکل خود را وارد کنید"
            required
        >


        <label for="message">
            توضیحات
        </label>

        <textarea
            id="message"
            placeholder="مشکل خود را کامل توضیح دهید..."
            required
        ></textarea>


        <button id="submitBtn" type="submit">
            ارسال تیکت
        </button>

    </form>


    <div id="result" class="message hidden" style="margin-top:20px;"></div>


    <div id="tickets"></div>

</div>

</div>


<script>

/* =========================================
   SUPABASE
========================================= */

/*
   این دو مقدار را از پروژه Supabase خودت بگذار.
*/

const SUPABASE_URL = "PROJECT_URL_HERE";

const SUPABASE_PUBLISHABLE_KEY =
"YOUR_PUBLISHABLE_KEY_HERE";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =========================================
   DOM
========================================= */

const loginBox =
    document.getElementById("loginBox");

const supportBox =
    document.getElementById("supportBox");

const userEmail =
    document.getElementById("userEmail");

const ticketForm =
    document.getElementById("ticketForm");

const submitBtn =
    document.getElementById("submitBtn");

const result =
    document.getElementById("result");

const tickets =
    document.getElementById("tickets");


/* =========================================
   نمایش پیام
========================================= */

function showResult(text, type){

    result.textContent = text;

    result.className =
        "message " + type;

}


/* =========================================
   بررسی کاربر
========================================= */

async function checkAuth(){

    try{

        const {
            data,
            error
        } = await supabaseClient.auth.getSession();


        if(error){
            console.error(error);
            showLogin();
            return;
        }


        const session = data.session;


        if(!session){

            showLogin();

            return;

        }


        showSupport(session.user);


    }catch(error){

        console.error(
            "AUTH ERROR:",
            error
        );

        showLogin();

    }

}


/* =========================================
   حالت بدون ورود
========================================= */

function showLogin(){

    loginBox.classList.remove("hidden");

    supportBox.classList.add("hidden");

}


/* =========================================
   حالت وارد شده
========================================= */

function showSupport(user){

    loginBox.classList.add("hidden");

    supportBox.classList.remove("hidden");

    if(user && user.email){

        userEmail.textContent =
            user.email;

    }else{

        userEmail.textContent =
            "کاربر وارد شده";

    }


    loadTickets(user.id);

}


/* =========================================
   ارسال تیکت
========================================= */

ticketForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        submitBtn.disabled = true;

        submitBtn.textContent =
            "در حال ارسال...";


        try{

            const {
                data,
                error
            } = await supabaseClient.auth.getUser();


            if(error || !data.user){

                showResult(
                    "جلسه شما منقضی شده است. دوباره وارد شوید.",
                    "error"
                );

                return;

            }


            const subject =
                document
                .getElementById("subject")
                .value
                .trim();


            const message =
                document
                .getElementById("message")
                .value
                .trim();


            if(!subject || !message){

                showResult(
                    "لطفاً همه فیلدها را تکمیل کنید.",
                    "error"
                );

                return;

            }


            const {
                error: insertError
            } = await supabaseClient
                .from("tickets")
                .insert({

                    user_id: data.user.id,

                    subject: subject,

                    message: message

                });


            if(insertError){

                console.error(
                    "TICKET ERROR:",
                    insertError
                );

                showResult(
                    "ارسال تیکت انجام نشد. تنظیمات دیتابیس را بررسی کنید.",
                    "error"
                );

                return;

            }


            showResult(
                "✅ تیکت شما با موفقیت ارسال شد.",
                "success"
            );


            ticketForm.reset();


            loadTickets(data.user.id);


        }catch(error){

            console.error(error);

            showResult(
                "خطایی در ارسال تیکت رخ داد.",
                "error"
            );

        }finally{

            submitBtn.disabled = false;

            submitBtn.textContent =
                "ارسال تیکت";

        }

    }
);


/* =========================================
   نمایش تیکت‌های کاربر
========================================= */

async function loadTickets(userId){

    tickets.innerHTML = "";


    const {
        data,
        error
    } = await supabaseClient
        .from("tickets")
        .select("*")
        .eq("user_id", userId)
        .order("created_at", {
            ascending:false
        });


    if(error){

        console.error(
            "LOAD TICKETS ERROR:",
            error
        );

        return;

    }


    if(!data || data.length === 0){

        return;

    }


    data.forEach(function(ticket){

        const div =
            document.createElement("div");

        div.className = "ticket";


        const title =
            document.createElement("h3");

        title.textContent =
            ticket.subject;


        const text =
            document.createElement("p");

        text.textContent =
            ticket.message;


        div.appendChild(title);

        div.appendChild(text);

        tickets.appendChild(div);

    });

}


/* =========================================
   تغییر وضعیت احراز هویت
========================================= */

supabaseClient.auth.onAuthStateChange(
    function(event, session){

        console.log(
            "AUTH EVENT:",
            event
        );


        if(session){

            showSupport(session.user);

        }else{

            showLogin();

        }

    }
);


/* =========================================
   شروع
========================================= */

checkAuth();

</script>

</body>
</html>
