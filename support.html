<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VENSIZ | پشتیبانی</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#050805;
    color:#fff;
    font-family:Tahoma,Arial,sans-serif;
    min-height:100vh;
}

/* ================= HEADER ================= */

header{
    height:80px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 6%;
    background:rgba(3,8,4,.95);
    border-bottom:1px solid rgba(0,255,100,.15);
    backdrop-filter:blur(15px);
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    color:#00ff66;
    text-decoration:none;
    font-size:28px;
    font-weight:bold;
    text-shadow:0 0 20px rgba(0,255,100,.7);
}

.logo-box{
    width:42px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:2px solid #00ff66;
    border-radius:10px;
    font-size:24px;
    box-shadow:
        0 0 15px rgba(0,255,100,.5),
        inset 0 0 15px rgba(0,255,100,.15);
}

nav{
    display:flex;
    gap:28px;
}

nav a{
    color:#ddd;
    text-decoration:none;
    font-size:14px;
    transition:.3s;
}

nav a:hover{
    color:#00ff66;
    text-shadow:0 0 10px #00ff66;
}

/* ================= PAGE ================= */

.page{
    min-height:calc(100vh - 80px);
    padding:90px 20px;
    position:relative;
    overflow:hidden;
}

.page::before{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;

    background-image:
        linear-gradient(
            rgba(0,255,100,.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(0,255,100,.025) 1px,
            transparent 1px
        );

    background-size:50px 50px;
}

.container{
    position:relative;
    max-width:900px;
    margin:auto;
}

/* ================= TITLE ================= */

.title{
    text-align:center;
    margin-bottom:45px;
}

.title h1{
    font-size:42px;
    margin-bottom:12px;
    text-shadow:
        0 0 15px rgba(0,255,100,.5);
}

.title span{
    color:#00ff66;
    font-size:13px;
    letter-spacing:2px;
}

/* ================= CARD ================= */

.card{
    background:rgba(10,17,11,.95);
    border:1px solid rgba(0,255,100,.15);
    border-radius:16px;
    padding:35px;
    box-shadow:
        0 0 40px rgba(0,0,0,.35);
}

/* ================= AUTH STATUS ================= */

.user-box{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;

    padding:15px 20px;
    margin-bottom:25px;

    background:#071009;
    border:1px solid rgba(0,255,100,.12);
    border-radius:10px;
}

.status{
    display:flex;
    align-items:center;
    gap:8px;

    color:#aaa;
    font-size:13px;
}

.dot{
    width:9px;
    height:9px;

    background:#00ff66;
    border-radius:50%;

    box-shadow:0 0 12px #00ff66;
}

.email{
    color:#00ff66;
    direction:ltr;
}

/* ================= FORM ================= */

label{
    display:block;
    margin-bottom:8px;
    color:#aaa;
    font-size:13px;
}

input,
textarea{
    width:100%;

    padding:14px;
    margin-bottom:20px;

    background:#050805;
    border:1px solid rgba(0,255,100,.15);
    border-radius:8px;

    color:white;
    outline:none;

    font-family:Tahoma,Arial,sans-serif;
    font-size:14px;

    transition:.3s;
}

input:focus,
textarea:focus{
    border-color:#00ff66;

    box-shadow:
        0 0 15px rgba(0,255,100,.1);
}

textarea{
    min-height:180px;
    resize:vertical;
}

/* ================= BUTTON ================= */

button{
    width:100%;

    padding:15px;

    border:none;
    border-radius:8px;

    background:#00c853;
    color:#001b08;

    font-weight:bold;
    font-size:15px;

    cursor:pointer;

    transition:.3s;
}

button:hover{
    background:#00ff66;

    box-shadow:
        0 0 25px rgba(0,255,100,.3);
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

/* ================= LOGIN ================= */

.login-message{
    text-align:center;

    background:#0a110b;

    border:1px solid rgba(0,255,100,.15);

    border-radius:16px;

    padding:45px 30px;

    box-shadow:
        0 0 40px rgba(0,0,0,.35);
}

.login-message h2{
    color:#00ff66;
    margin-bottom:15px;
}

.login-message p{
    color:#999;
    line-height:2;
}

.auth-btn{
    display:inline-block;

    margin-top:25px;

    padding:13px 30px;

    border-radius:8px;

    background:#00c853;
    color:#001b08;

    text-decoration:none;

    font-weight:bold;

    transition:.3s;
}

.auth-btn:hover{
    background:#00ff66;

    box-shadow:
        0 0 25px rgba(0,255,100,.3);
}

/* ================= RESULT ================= */

.message{
    padding:16px;

    border-radius:10px;

    text-align:center;

    line-height:2;

    margin-top:20px;
}

.success{
    background:rgba(0,200,83,.08);
    border:1px solid rgba(0,255,100,.3);
    color:#00ff66;
}

.error{
    background:rgba(255,50,50,.08);
    border:1px solid rgba(255,50,50,.25);
    color:#ff7777;
}

/* ================= TICKETS ================= */

.my-tickets{
    margin-top:35px;
}

.my-tickets-title{
    color:#00ff66;
    margin-bottom:15px;
    font-size:16px;
}

.ticket{
    margin-top:15px;

    padding:20px;

    background:#071009;

    border:1px solid rgba(0,255,100,.1);

    border-radius:10px;
}

.ticket h3{
    color:#00ff66;
    margin-bottom:10px;
}

.ticket p{
    color:#aaa;
    line-height:1.9;
    white-space:pre-wrap;
}

.ticket-status{
    display:inline-block;

    margin-top:12px;

    padding:5px 10px;

    border-radius:5px;

    background:rgba(0,255,100,.08);

    color:#00ff66;

    font-size:11px;
}

.empty{
    color:#666;
    text-align:center;
    padding:20px;
}

/* ================= HIDDEN ================= */

.hidden{
    display:none !important;
}

/* ================= MOBILE ================= */

@media(max-width:700px){

    header{
        padding:0 20px;
    }

    nav{
        display:none;
    }

    .page{
        padding:60px 15px;
    }

    .title h1{
        font-size:32px;
    }

    .card{
        padding:20px;
    }

    .user-box{
        flex-direction:column;
        align-items:flex-start;
    }

    .email{
        font-size:12px;
    }
}
</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header>

<a href="index.html" class="logo">

    <div class="logo-box">
        V
    </div>

    VENSIZ

</a>

<nav>

    <a href="rules.html">قوانین</a>

    <a href="updates.html">بروزرسانی‌ها</a>

    <a href="download.html">دانلود</a>

    <a href="about.html">درباره ما</a>

    <a href="shop.html">فروشگاه</a>

    <a href="support.html">پشتیبانی</a>

</nav>

</header>


<!-- ================= PAGE ================= -->

<main class="page">

<div class="container">


<div class="title">

    <h1>
        پشتیبانی VENSIZ
    </h1>

    <span>
        VENSIZ SUPPORT CENTER
    </span>

</div>


<!-- ================= LOGIN MESSAGE ================= -->

<div id="loginBox" class="login-message hidden">

    <h2>
        🔐 ابتدا احراز هویت کنید
    </h2>

    <p>
        برای ارسال تیکت پشتیبانی ابتدا باید وارد حساب کاربری خود شوید.
    </p>

    <a href="login.html" class="auth-btn">
        احراز هویت
    </a>

</div>


<!-- ================= SUPPORT ================= -->

<div id="supportBox" class="card hidden">


    <div class="user-box">

        <div class="status">

            <div class="dot"></div>

            احراز هویت شده

        </div>


        <div id="userEmail" class="email">
            -
        </div>

    </div>


    <!-- FORM -->

    <form id="ticketForm">

        <label for="subject">
            موضوع تیکت
        </label>

        <input
            id="subject"
            type="text"
            placeholder="موضوع مشکل خود را وارد کنید"
            required
        >


        <label for="message">
            توضیحات مشکل
        </label>

        <textarea
            id="message"
            placeholder="مشکل خود را کامل توضیح دهید..."
            required
        ></textarea>


        <button
            id="submitBtn"
            type="submit"
        >
            ارسال تیکت
        </button>

    </form>


    <!-- RESULT -->

    <div
        id="result"
        class="message hidden"
    ></div>


    <!-- MY TICKETS -->

    <div class="my-tickets">

        <div class="my-tickets-title">
            تیکت‌های من
        </div>

        <div id="tickets">

            <div class="empty">
                در حال دریافت تیکت‌ها...
            </div>

        </div>

    </div>

</div>

</div>

</main>


<script>

/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
    "https://gpeckwmijsgklzhtgqdso.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_L4G2SJVjpML_5NiKb4tS7A_qXc5MzTZ";


/* =====================================================
   CREATE SUPABASE CLIENT
===================================================== */

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =====================================================
   ELEMENTS
===================================================== */

const loginBox =
    document.getElementById("loginBox");

const supportBox =
    document.getElementById("supportBox");

const userEmail =
    document.getElementById("userEmail");

const ticketForm =
    document.getElementById("ticketForm");

const submitBtn =
    document.getElementById("submitBtn");

const result =
    document.getElementById("result");

const tickets =
    document.getElementById("tickets");


/* =====================================================
   SHOW LOGIN
===================================================== */

function showLogin(){

    loginBox.classList.remove("hidden");

    supportBox.classList.add("hidden");

}


/* =====================================================
   SHOW SUPPORT
===================================================== */

function showSupport(user){

    loginBox.classList.add("hidden");

    supportBox.classList.remove("hidden");


    if(user && user.email){

        userEmail.textContent =
            user.email;

    }else{

        userEmail.textContent =
            "کاربر وارد شده";

    }


    loadTickets(user.id);

}


/* =====================================================
   RESULT
===================================================== */

function showResult(text,type){

    result.textContent = text;

    result.className =
        "message " + type;

    result.classList.remove("hidden");

}


/* =====================================================
   CHECK AUTH
===================================================== */

async function checkAuth(){

    try{

        const {
            data,
            error
        } = await supabaseClient.auth.getSession();


        if(error){

            console.error(
                "SESSION ERROR:",
                error
            );

            showLogin();

            return;

        }


        const session =
            data.session;


        if(session){

            showSupport(
                session.user
            );

        }else{

            showLogin();

        }

    }catch(error){

        console.error(
            "AUTH ERROR:",
            error
        );

        showLogin();

    }

}


/* =====================================================
   AUTH STATE
===================================================== */

supabaseClient.auth.onAuthStateChange(
    function(event,session){

        console.log(
            "AUTH EVENT:",
            event
        );


        if(session){

            showSupport(
                session.user
            );

        }else{

            showLogin();

        }

    }
);


/* =====================================================
   SEND TICKET
===================================================== */

ticketForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        submitBtn.disabled = true;

        submitBtn.textContent =
            "در حال ارسال...";


        result.classList.add("hidden");


        try{

            /* Get current user */

            const {
                data,
                error
            } = await supabaseClient.auth.getUser();


            if(error || !data.user){

                showResult(
                    "احراز هویت شما معتبر نیست. لطفاً دوباره وارد شوید.",
                    "error"
                );

                return;

            }


            const user =
                data.user;


            /* Get form data */

            const subject =
                document
                .getElementById("subject")
                .value
                .trim();


            const message =
                document
                .getElementById("message")
                .value
                .trim();


            if(!subject || !message){

                showResult(
                    "لطفاً موضوع و توضیحات را وارد کنید.",
                    "error"
                );

                return;

            }


            /* Insert ticket */

            const {
                error: insertError
            } = await supabaseClient
                .from("tickets")
                .insert({

                    user_id:
                        user.id,

                    subject:
                        subject,

                    message:
                        message

                });


            if(insertError){

                console.error(
                    "INSERT ERROR:",
                    insertError
                );


                showResult(
                    "ارسال تیکت انجام نشد. خطای دیتابیس دریافت شد.",
                    "error"
                );

                return;

            }


            /* Success */

            ticketForm.reset();


            showResult(
                "✅ تیکت شما با موفقیت ارسال شد.",
                "success"
            );


            await loadTickets(
                user.id
            );


        }catch(error){

            console.error(
                "TICKET ERROR:",
                error
            );


            showResult(
                "خطایی هنگام ارسال تیکت رخ داد.",
                "error"
            );

        }finally{

            submitBtn.disabled = false;

            submitBtn.textContent =
                "ارسال تیکت";

        }

    }
);


/* =====================================================
   LOAD USER TICKETS
===================================================== */

async function loadTickets(userId){

    tickets.innerHTML =
        '<div class="empty">در حال دریافت تیکت‌ها...</div>';


    try{

        const {
            data,
            error
        } = await supabaseClient
            .from("tickets")
            .select(
                "id, subject, message, status, created_at"
            )
            .eq(
                "user_id",
                userId
            )
            .order(
                "created_at",
                {
                    ascending:false
                }
            );


        if(error){

            console.error(
                "LOAD ERROR:",
                error
            );

            tickets.innerHTML =
                '<div class="empty">امکان دریافت تیکت‌ها وجود ندارد.</div>';

            return;

        }


        if(!data || data.length === 0){

            tickets.innerHTML =
                '<div class="empty">هنوز هیچ تیکتی ارسال نکرده‌اید.</div>';

            return;

        }


        tickets.innerHTML = "";


        data.forEach(
            function(ticket){

                const box =
                    document.createElement(
                        "div"
                    );

                box.className =
                    "ticket";


                const title =
                    document.createElement(
                        "h3"
                    );

                title.textContent =
                    ticket.subject;


                const text =
                    document.createElement(
                        "p"
                    );

                text.textContent =
                    ticket.message;


                const status =
                    document.createElement(
                        "div"
                    );

                status.className =
                    "ticket-status";


                status.textContent =
                    ticket.status ||
                    "open";


                box.appendChild(
                    title
                );

                box.appendChild(
                    text
                );

                box.appendChild(
                    status
                );


                tickets.appendChild(
                    box
                );

            }
        );


    }catch(error){

        console.error(
            "TICKETS ERROR:",
            error
        );

        tickets.innerHTML =
            '<div class="empty">خطایی هنگام دریافت تیکت‌ها رخ داد.</div>';

    }

}


/* =====================================================
   START
===================================================== */

checkAuth();

</script>

</body>
</html>
