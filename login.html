<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>احراز هویت | VENSIZ</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:#050805;
    color:#fff;
    font-family:Tahoma,Arial,sans-serif;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;
}

.auth-box{

    width:100%;
    max-width:430px;

    padding:40px 30px;

    background:#080e09;

    border:1px solid rgba(0,255,100,.2);

    border-radius:20px;

    box-shadow:
    0 20px 70px rgba(0,0,0,.5),
    0 0 40px rgba(0,255,100,.05);

    text-align:center;
}

.logo{

    width:75px;
    height:75px;

    margin:0 auto 20px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:2px solid #00ff66;

    border-radius:18px;

    color:#00ff66;

    font-size:40px;
    font-weight:bold;

    box-shadow:
    0 0 25px rgba(0,255,100,.3);
}

h1{
    font-size:27px;
    margin-bottom:8px;
}

h1 span{
    color:#00ff66;
}

.subtitle{
    color:#888;
    font-size:13px;
    margin-bottom:30px;
}

input{

    width:100%;

    padding:14px;

    margin-bottom:13px;

    background:#050805;

    color:#fff;

    border:1px solid rgba(0,255,100,.15);

    border-radius:9px;

    outline:none;

    font-family:Tahoma,Arial,sans-serif;

    direction:rtl;
}

input:focus{
    border-color:#00ff66;
}

button{

    width:100%;

    padding:14px;

    margin-top:5px;

    border:none;

    border-radius:9px;

    background:#00d95a;

    color:#001b08;

    font-weight:bold;

    cursor:pointer;

    font-family:Tahoma,Arial,sans-serif;

    transition:.3s;
}

button:hover{

    background:#00ff66;

    box-shadow:
    0 0 25px rgba(0,255,100,.3);
}

.switch{

    margin-top:20px;

    color:#777;

    font-size:12px;
}

.switch span{

    color:#00ff66;

    cursor:pointer;

    font-weight:bold;
}

.message{

    margin-top:18px;

    padding:10px;

    border-radius:8px;

    font-size:12px;

    display:none;
}

.success{

    display:block;

    color:#00ff66;

    background:rgba(0,255,100,.06);

    border:1px solid rgba(0,255,100,.15);
}

.error{

    display:block;

    color:#ff7070;

    background:rgba(255,0,0,.05);

    border:1px solid rgba(255,0,0,.15);
}

.back{

    display:block;

    margin-top:22px;

    color:#777;

    text-decoration:none;

    font-size:12px;
}

.back:hover{
    color:#00ff66;
}

</style>

</head>

<body>

<div class="auth-box">

<div class="logo">
V
</div>

<h1>
VENSIZ <span>AUTH</span>
</h1>

<div class="subtitle">
ورود یا ثبت‌نام در حساب VENSIZ
</div>


<input
    type="email"
    id="email"
    placeholder="ایمیل"
    autocomplete="email"
>


<input
    type="password"
    id="password"
    placeholder="رمز عبور"
    autocomplete="current-password"
>


<button id="authButton">
ورود
</button>


<div class="switch" id="switchText">

حساب کاربری ندارید؟

<span id="switchMode">
ثبت‌نام
</span>

</div>


<div id="message" class="message"></div>


<a href="index.html" class="back">
← بازگشت به سایت
</a>

</div>


<script>

const SUPABASE_URL =
"https://gpeckwmjsgklzhtgqdso.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_L4G2SJVjpML_5NiKb4tS7A_qXc5MzTZ";

const { createClient } =
supabase;

const supabaseClient =
createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


let isSignup = false;


const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const authButton =
document.getElementById("authButton");

const switchMode =
document.getElementById("switchMode");

const switchText =
document.getElementById("switchText");

const message =
document.getElementById("message");


function showMessage(text,type){

    message.textContent = text;

    message.className =
    "message " + type;
}


switchMode.addEventListener("click",()=>{

    isSignup = !isSignup;

    if(isSignup){

        authButton.textContent =
        "ثبت‌نام";

        switchText.innerHTML =
        'قبلاً حساب ساخته‌اید؟ <span id="switchMode">ورود</span>';

    }else{

        authButton.textContent =
        "ورود";

        switchText.innerHTML =
        'حساب کاربری ندارید؟ <span id="switchMode">ثبت‌نام</span>';

    }

    document.getElementById("switchMode")
    .addEventListener("click",arguments.callee);

});


authButton.addEventListener("click",async()=>{

    const email =
    emailInput.value.trim();

    const password =
    passwordInput.value;


    if(!email || !password){

        showMessage(
            "ایمیل و رمز عبور را وارد کنید.",
            "error"
        );

        return;
    }


    authButton.disabled = true;


    if(isSignup){

        const { error } =
        await supabaseClient.auth.signUp({

            email:email,

            password:password,

            options:{
                emailRedirectTo:
                "https://vensiz.github.io/index.html"
            }

        });


        if(error){

            showMessage(
                error.message,
                "error"
            );

        }else{

            showMessage(
                "ثبت‌نام انجام شد. ایمیل خود را برای تأیید بررسی کنید.",
                "success"
            );

        }

    }else{

        const { error } =
        await supabaseClient.auth.signInWithPassword({

            email:email,

            password:password

        });


        if(error){

            showMessage(
                error.message,
                "error"
            );

        }else{

            showMessage(
                "ورود موفق بود. در حال انتقال...",
                "success"
            );

            setTimeout(()=>{

                window.location.href =
                "index.html";

            },1000);

        }

    }


    authButton.disabled = false;

});

</script>

</body>

</html>
