<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>احراز هویت | VENSIZ</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:#050805;
    color:#fff;
    font-family:Tahoma,Arial,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.auth-box{
    width:100%;
    max-width:430px;
    padding:40px 30px;
    background:#080e09;
    border:1px solid rgba(0,255,100,.2);
    border-radius:20px;
    box-shadow:
        0 20px 70px rgba(0,0,0,.5),
        0 0 40px rgba(0,255,100,.05);
    text-align:center;
}

.logo{
    width:75px;
    height:75px;
    margin:0 auto 20px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:2px solid #00ff66;
    border-radius:18px;
    color:#00ff66;
    font-size:40px;
    font-weight:bold;
    box-shadow:0 0 25px rgba(0,255,100,.3);
}

h1{
    font-size:27px;
    margin-bottom:8px;
}

h1 span{
    color:#00ff66;
}

.subtitle{
    color:#888;
    font-size:13px;
    margin-bottom:30px;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:13px;
    background:#050805;
    color:#fff;
    border:1px solid rgba(0,255,100,.15);
    border-radius:9px;
    outline:none;
    font-family:Tahoma,Arial,sans-serif;
    direction:rtl;
}

input:focus{
    border-color:#00ff66;
}

button{
    width:100%;
    padding:14px;
    margin-top:5px;
    border:none;
    border-radius:9px;
    background:#00d95a;
    color:#001b08;
    font-weight:bold;
    cursor:pointer;
    font-family:Tahoma,Arial,sans-serif;
    transition:.3s;
}

button:hover{
    background:#00ff66;
    box-shadow:0 0 25px rgba(0,255,100,.3);
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.switch{
    margin-top:20px;
    color:#777;
    font-size:12px;
}

.switch span{
    color:#00ff66;
    cursor:pointer;
    font-weight:bold;
}

.message{
    margin-top:18px;
    padding:10px;
    border-radius:8px;
    font-size:12px;
    display:none;
}

.success{
    display:block;
    color:#00ff66;
    background:rgba(0,255,100,.06);
    border:1px solid rgba(0,255,100,.15);
}

.error{
    display:block;
    color:#ff7070;
    background:rgba(255,0,0,.05);
    border:1px solid rgba(255,0,0,.15);
}

.back{
    display:block;
    margin-top:22px;
    color:#777;
    text-decoration:none;
    font-size:12px;
}

.back:hover{
    color:#00ff66;
}
</style>
</head>

<body>

<div class="auth-box">

    <div class="logo">V</div>

    <h1>
        VENSIZ <span>AUTH</span>
    </h1>

    <div class="subtitle">
        ورود یا ثبت‌نام در حساب VENSIZ
    </div>

    <input
        type="email"
        id="email"
        placeholder="ایمیل"
        autocomplete="email"
    >

    <input
        type="password"
        id="password"
        placeholder="رمز عبور"
        autocomplete="current-password"
    >

    <button id="authButton">
        ورود
    </button>

    <div class="switch">
        <span id="switchMode">ثبت‌نام</span>
    </div>

    <div id="message" class="message"></div>

    <a href="index.html" class="back">
        ← بازگشت به سایت
    </a>

</div>

<script>

/* =========================================
   VENSIZ SUPABASE CONFIG
========================================= */

const SUPABASE_URL =
"https://gpeckwmjsgklzhtgqdso.supabase.co";

const SUPABASE_KEY =
"sb_publishable_L4G2SJVjpML_5NiKb4tS7A_qXc5MzTZ";


/* =========================================
   CREATE ONE SUPABASE CLIENT
========================================= */

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
        auth:{
            persistSession:true,
            autoRefreshToken:true,
            detectSessionInUrl:true,

            /* بسیار مهم */
            storageKey:"vensiz-auth-session"
        }
    }
);


/* =========================================
   ELEMENTS
========================================= */

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const authButton =
document.getElementById("authButton");

const switchMode =
document.getElementById("switchMode");

const message =
document.getElementById("message");


let isSignup = false;


/* =========================================
   MESSAGE
========================================= */

function showMessage(text,type){

    message.textContent = text;

    message.className =
        "message " + type;
}


/* =========================================
   SWITCH LOGIN / SIGNUP
========================================= */

switchMode.addEventListener("click",function(){

    isSignup = !isSignup;

    if(isSignup){

        authButton.textContent = "ثبت‌نام";

        switchMode.textContent =
            "قبلاً حساب ساخته‌اید؟ ورود";

    }else{

        authButton.textContent = "ورود";

        switchMode.textContent =
            "حساب کاربری ندارید؟ ثبت‌نام";
    }

});


/* =========================================
   AUTH
========================================= */

authButton.addEventListener("click",async function(){

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;


    if(!email || !password){

        showMessage(
            "ایمیل و رمز عبور را وارد کنید.",
            "error"
        );

        return;
    }


    authButton.disabled = true;


    try{

        /* =========================
           SIGN UP
        ========================= */

        if(isSignup){

            const { data,error } =
                await supabaseClient.auth.signUp({

                    email:email,

                    password:password,

                    options:{
                        emailRedirectTo:
                        "https://vensiz.github.io/index.html"
                    }

                });


            if(error){

                showMessage(
                    error.message,
                    "error"
                );

                return;
            }


            /*
             اگر تأیید ایمیل خاموش باشد
             سشن همینجا ساخته می‌شود.
            */

            if(data.session){

                showMessage(
                    "ثبت‌نام موفق بود. در حال ورود...",
                    "success"
                );

                setTimeout(function(){

                    window.location.href =
                        "index.html";

                },800);

            }else{

                showMessage(
                    "ثبت‌نام انجام شد. ایمیل خود را برای تأیید بررسی کنید.",
                    "success"
                );
            }

        }


        /* =========================
           LOGIN
        ========================= */

        else{

            const { data,error } =
                await supabaseClient.auth.signInWithPassword({

                    email:email,

                    password:password

                });


            if(error){

                showMessage(
                    error.message,
                    "error"
                );

                return;
            }


            if(!data.session){

                showMessage(
                    "ورود انجام نشد؛ سشن کاربر ایجاد نشده است.",
                    "error"
                );

                return;
            }


            /*
             مطمئن می‌شویم session ذخیره شده
            */

            await supabaseClient.auth.setSession({
                access_token:data.session.access_token,
                refresh_token:data.session.refresh_token
            });


            showMessage(
                "ورود موفق بود. در حال انتقال...",
                "success"
            );


            setTimeout(function(){

                window.location.href =
                    "index.html";

            },800);

        }

    }catch(error){

        console.error(error);

        showMessage(
            "خطایی در ارتباط با سرور رخ داد.",
            "error"
        );

    }finally{

        authButton.disabled = false;

    }

});


/* =========================================
   CHECK EXISTING SESSION
========================================= */

supabaseClient.auth.getSession()
.then(function(result){

    if(result.data && result.data.session){

        console.log(
            "VENSIZ AUTH: SESSION ACTIVE"
        );

    }else{

        console.log(
            "VENSIZ AUTH: NO SESSION"
        );

    }

});

</script>

</body>
</html>
