<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = 'https://gpeckwmjsgklzhtqgdso.supabase.co';

const SUPABASE_PUBLISHABLE_KEY =
    'sb_publishable_L4G2SJVjpML_5NiKb4tS7A_qXc5MzTZ';

const supabase = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


/* =========================
   LOGIN
========================= */

async function loginUser(email, password) {

    const { data, error } = await supabase.auth.signInWithPassword({
        email: email,
        password: password
    });

    if (error) {
        console.error('Login Error:', error.message);
        alert('ورود ناموفق بود: ' + error.message);
        return false;
    }

    console.log('User logged in:', data.user);

    return true;
}


/* =========================
   REGISTER
========================= */

async function registerUser(email, password) {

    const { data, error } = await supabase.auth.signUp({
        email: email,
        password: password
    });

    if (error) {
        console.error('Register Error:', error.message);
        alert('ثبت‌نام ناموفق بود: ' + error.message);
        return false;
    }

    alert('ثبت‌نام انجام شد. ایمیل خود را تأیید کنید.');

    console.log('User registered:', data.user);

    return true;
}


/* =========================
   LOGOUT
========================= */

async function logoutUser() {

    const { error } = await supabase.auth.signOut();

    if (error) {
        console.error('Logout Error:', error.message);
        return;
    }

    window.location.href = 'index.html';
}


/* =========================
   CHECK USER
========================= */

async function getCurrentUser() {

    const {
        data: { user }
    } = await supabase.auth.getUser();

    return user;
}
</script>
