<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:#050805;

    0 0 25px rgba(0,255,100,.3);

</head>

<body>

<div class="auth-box">

    <div class="logo">
        V
    </div>

    <h1>
        VENSIZ <span>AUTH</span>
    </h1>

    <div class="subtitle">
        ورود یا ثبت‌نام در حساب VENSIZ
    </div>

    <input
        type="email"
        id="email"
        placeholder="ایمیل"
        autocomplete="email"
    >

    <input
        type="password"
        id="password"
        placeholder="رمز عبور"
        autocomplete="current-password"
    >

    <button id="authButton">
        ورود
    </button>

    <div class="switch" id="switchText">
        حساب کاربری ندارید؟
        <span id="switchMode">ثبت‌نام</span>
    </div>

    <div id="message" class="message"></div>

    <a href="index.html" class="back">
        ← بازگشت به سایت
    </a>

</div>


<script>

/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
    "https://gpeckwmijsgklzhtgqdso.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_L4G2SJVjpML_5NiKb4tS7A_qXc5MzTZ";


/* =====================================================
   SUPABASE CLIENT
===================================================== */

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY,
        {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true,
                storage: window.localStorage,
                storageKey: "vensiz-auth-session"
            }
        }
    );


/* =====================================================
   ELEMENTS
===================================================== */

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const authButton =
    document.getElementById("authButton");

const switchText =
    document.getElementById("switchText");

const message =
    document.getElementById("message");


/* =====================================================
   MODE
===================================================== */

let isSignup = false;


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text, type){

    message.textContent = text;

    message.className =
        "message " + type;

}


/* =====================================================
   SWITCH LOGIN / SIGNUP
===================================================== */

function updateMode(){

    if(isSignup){

        authButton.textContent =
            "ثبت‌نام";

        switchText.innerHTML =
            'قبلاً حساب ساخته‌اید؟ <span id="switchMode">ورود</span>';

    }else{

        authButton.textContent =
            "ورود";

        switchText.innerHTML =
            'حساب کاربری ندارید؟ <span id="switchMode">ثبت‌نام</span>';

    }


    document
        .getElementById("switchMode")
        .addEventListener(
            "click",
            function(){

                isSignup =
                    !isSignup;

                updateMode();

                message.className =
                    "message";

            }
        );

}


updateMode();


/* =====================================================
   LOGIN / SIGNUP
===================================================== */

authButton.addEventListener(
    "click",
    async function(){

        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;


        if(!email || !password){

            showMessage(
                "ایمیل و رمز عبور را وارد کنید.",
                "error"
            );

            return;

        }


        if(password.length < 6){

            showMessage(
                "رمز عبور باید حداقل ۶ کاراکتر باشد.",
                "error"
            );

            return;

        }


        authButton.disabled =
            true;


        authButton.textContent =
            isSignup
                ? "در حال ثبت‌نام..."
                : "در حال ورود...";


        try{

            /* =================================================
               SIGN UP
            ================================================= */

            if(isSignup){

                const {
                    data,
                    error
                } =
                await supabaseClient.auth.signUp({

                    email: email,

                    password: password,

                    options: {

                        emailRedirectTo:
                            "https://vensiz.github.io/index.html"

                    }

                });


                if(error){

                    showMessage(
                        error.message,
                        "error"
                    );

                    return;

                }


                /*
                 اگر تأیید ایمیل فعال باشد،
                 Supabase ممکن است Session را بلافاصله ندهد.
                */

                if(data.session){

                    showMessage(
                        "ثبت‌نام و ورود با موفقیت انجام شد.",
                        "success"
                    );


                    setTimeout(
                        function(){

                            window.location.href =
                                "https://vensiz.github.io/index.html";

                        },
                        700
                    );

                }else{

                    showMessage(
                        "ثبت‌نام انجام شد. ایمیل خود را برای تأیید حساب بررسی کنید.",
                        "success"
                    );

                }

                return;

            }


            /* =================================================
               LOGIN
            ================================================= */

            const {
                data,
                error
            } =
            await supabaseClient.auth.signInWithPassword({

                email: email,

                password: password

            });


            if(error){

                showMessage(
                    error.message,
                    "error"
                );

                return;

            }


            if(!data.session){

                showMessage(
                    "ورود انجام شد اما Session دریافت نشد. دوباره تلاش کنید.",
                    "error"
                );

                return;

            }


            /* =================================================
               VERIFY SESSION WAS SAVED
            ================================================= */

            const {
                data: sessionData
            } =
            await supabaseClient.auth.getSession();


            if(!sessionData.session){

                showMessage(
                    "Session ذخیره نشد. لطفاً دوباره تلاش کنید.",
                    "error"
                );

                return;

            }


            console.log(
                "VENSIZ AUTH SUCCESS:",
                sessionData.session.user.email
            );


            showMessage(
                "ورود موفق بود. در حال انتقال...",
                "success"
            );


            /* =================================================
               GO TO HOME
            ================================================= */

            setTimeout(
                function(){

                    window.location.replace(
                        "https://vensiz.github.io/index.html"
                    );

                },
                700
            );


        }catch(error){

            console.error(
                "VENSIZ AUTH ERROR:",
                error
            );


            showMessage(
                "خطای غیرمنتظره‌ای رخ داد. کنسول مرورگر را بررسی کنید.",
                "error"
            );

        }finally{

            authButton.disabled =
                false;

            authButton.textContent =
                isSignup
                    ? "ثبت‌نام"
                    : "ورود";

        }

    }
);


/* =====================================================
   ENTER KEY
===================================================== */

emailInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            passwordInput.focus();

        }

    }
);


passwordInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            authButton.click();

        }

    }
);


/* =====================================================
   CHECK EXISTING SESSION
===================================================== */

async function checkExistingSession(){

    try{

        const {
            data
        } =
        await supabaseClient.auth.getSession();


        if(data.session){

            console.log(
                "Existing VENSIZ session:",
                data.session.user.email
            );

        }

    }catch(error){

        console.error(
            "SESSION CHECK ERROR:",
            error
        );

    }

}


checkExistingSession();


/* =====================================================
   AUTH STATE LISTENER
===================================================== */

supabaseClient.auth.onAuthStateChange(
    function(event, session){

        console.log(
            "VENSIZ AUTH EVENT:",
            event
        );

        if(session){

            console.log(
                "Logged in:",
                session.user.email
            );

        }

    }
);

</script>

</body>
</html>
