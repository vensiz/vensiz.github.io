<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ورود | VENSIZ</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:30px;

    background:
    radial-gradient(
        circle at center,
        rgba(0,255,100,.10),
        transparent 45%
    ),
    #050805;

    color:#fff;

    font-family:
    Tahoma,
    Arial,
    sans-serif;
}


/* =========================
   BOX
========================= */

.auth-box{

    width:100%;
    max-width:450px;

    padding:42px 32px;

    background:#080e09;

    border:1px solid rgba(0,255,100,.18);

    border-radius:22px;

    box-shadow:
    0 25px 80px rgba(0,0,0,.55),
    0 0 50px rgba(0,255,100,.04);

    text-align:center;

}


/* =========================
   LOGO
========================= */

.logo{

    width:82px;
    height:82px;

    margin:0 auto 22px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:2px solid #00ff66;

    border-radius:20px;

    color:#00ff66;

    font-size:43px;

    font-weight:bold;

    box-shadow:
    0 0 30px rgba(0,255,100,.30),
    inset 0 0 20px rgba(0,255,100,.08);

}


h1{

    font-size:27px;

    margin-bottom:8px;

}


h1 span{

    color:#00ff66;

}


.subtitle{

    color:#777;

    font-size:13px;

    margin-bottom:30px;

}


/* =========================
   TABS
========================= */

.tabs{

    display:flex;

    gap:10px;

    margin-bottom:25px;

}


.tab{

    flex:1;

    padding:13px;

    border:1px solid rgba(0,255,100,.15);

    border-radius:9px;

    background:#0a110b;

    color:#888;

    cursor:pointer;

    font-family:inherit;

    transition:.3s;

}


.tab:hover{

    border-color:#00ff66;

    color:#00ff66;

}


.tab.active{

    color:#00ff66;

    background:rgba(0,255,100,.08);

    border-color:#00ff66;

}


/* =========================
   FORM
========================= */

.form{

    display:none;

}


.form.active{

    display:block;

}


.input{

    width:100%;

    height:50px;

    padding:0 15px;

    margin-bottom:14px;

    border:1px solid rgba(0,255,100,.15);

    border-radius:9px;

    background:#050805;

    color:#fff;

    outline:none;

    font-family:inherit;

    font-size:13px;

    direction:ltr;

    text-align:left;

    transition:.3s;

}


.input:focus{

    border-color:#00ff66;

    box-shadow:
    0 0 15px rgba(0,255,100,.08);

}


.input::placeholder{

    color:#555;

}


/* =========================
   BUTTON
========================= */

.button{

    width:100%;

    height:50px;

    border:none;

    border-radius:9px;

    background:#00c853;

    color:#001b08;

    font-family:inherit;

    font-size:13px;

    font-weight:bold;

    cursor:pointer;

    transition:.3s;

}


.button:hover{

    background:#00ff66;

    transform:translateY(-2px);

    box-shadow:
    0 0 25px rgba(0,255,100,.25);

}


.button:disabled{

    opacity:.5;

    cursor:not-allowed;

    transform:none;

}


/* =========================
   MESSAGE
========================= */

.message{

    min-height:28px;

    margin-top:18px;

    color:#aaa;

    font-size:12px;

    line-height:2;

}


/* =========================
   BACK
========================= */

.back{

    display:inline-block;

    margin-top:20px;

    color:#00ff66;

    text-decoration:none;

    font-size:12px;

    transition:.3s;

}


.back:hover{

    text-shadow:
    0 0 10px #00ff66;

}


/* =========================
   MOBILE
========================= */

@media(max-width:500px){

    body{

        padding:15px;

    }

    .auth-box{

        padding:35px 22px;

    }

}

</style>

</head>


<body>


<div class="auth-box">


<!-- LOGO -->

<div class="logo">

V

</div>


<h1>

VENSIZ <span>ROLEPLAY</span>

</h1>


<div class="subtitle">

ورود به حساب کاربری VENSIZ

</div>


<!-- TABS -->

<div class="tabs">

<button
    type="button"
    class="tab active"
    id="loginTab"
    onclick="showForm('login')">

    ورود

</button>


<button
    type="button"
    class="tab"
    id="signupTab"
    onclick="showForm('signup')">

    ثبت‌نام

</button>

</div>



<!-- =========================
     LOGIN
========================= -->

<div
    id="loginForm"
    class="form active">

<input
    id="loginEmail"
    class="input"
    type="email"
    placeholder="ایمیل"
    autocomplete="email"
>


<input
    id="loginPassword"
    class="input"
    type="password"
    placeholder="رمز عبور"
    autocomplete="current-password"
>


<button
    id="loginButton"
    type="button"
    class="button"
    onclick="login()">

    ورود به حساب

</button>

</div>



<!-- =========================
     SIGNUP
========================= -->

<div
    id="signupForm"
    class="form">


<input
    id="signupEmail"
    class="input"
    type="email"
    placeholder="ایمیل"
    autocomplete="email"
>


<input
    id="signupPassword"
    class="input"
    type="password"
    placeholder="رمز عبور"
    autocomplete="new-password"
>


<input
    id="signupPassword2"
    class="input"
    type="password"
    placeholder="تکرار رمز عبور"
    autocomplete="new-password"
>


<button
    id="signupButton"
    type="button"
    class="button"
    onclick="signup()">

    ساخت حساب

</button>

</div>


<!-- MESSAGE -->

<div
    id="message"
    class="message">
</div>


<a
    href="index.html"
    class="back">

    ← بازگشت به صفحه اصلی

</a>


</div>



<!-- =========================
     SUPABASE
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/* =========================
   SUPABASE CONFIG
========================= */

const SUPABASE_URL =
'https://gpeckwmjsgklzhtqgdso.supabase.co';


const SUPABASE_PUBLISHABLE_KEY =
'sb_publishable_L4G2SJVjpML_5NiKb4tS7A_qXc5MzTZ';


const supabase =
window.supabase.createClient(

    SUPABASE_URL,

    SUPABASE_PUBLISHABLE_KEY

);



/* =========================
   MESSAGE
========================= */

function showMessage(text){

    document
    .getElementById('message')
    .textContent = text;

}


function clearMessage(){

    document
    .getElementById('message')
    .textContent = '';

}



/* =========================
   SWITCH
========================= */

function showForm(type){

    clearMessage();


    const loginForm =
    document.getElementById('loginForm');


    const signupForm =
    document.getElementById('signupForm');


    const loginTab =
    document.getElementById('loginTab');


    const signupTab =
    document.getElementById('signupTab');


    if(type === 'login'){

        loginForm.classList.add('active');

        signupForm.classList.remove('active');

        loginTab.classList.add('active');

        signupTab.classList.remove('active');

    }

    else{

        signupForm.classList.add('active');

        loginForm.classList.remove('active');

        signupTab.classList.add('active');

        loginTab.classList.remove('active');

    }

}



/* =========================
   SIGN UP
========================= */

async function signup(){

    const email =
    document
    .getElementById('signupEmail')
    .value
    .trim();


    const password =
    document
    .getElementById('signupPassword')
    .value;


    const password2 =
    document
    .getElementById('signupPassword2')
    .value;


    const button =
    document
    .getElementById('signupButton');


    if(!email){

        showMessage(
            'لطفاً ایمیل خود را وارد کنید.'
        );

        return;

    }


    if(!password){

        showMessage(
            'لطفاً رمز عبور را وارد کنید.'
        );

        return;

    }


    if(password.length < 6){

        showMessage(
            'رمز عبور باید حداقل ۶ کاراکتر باشد.'
        );

        return;

    }


    if(password !== password2){

        showMessage(
            'تکرار رمز عبور با رمز اصلی یکسان نیست.'
        );

        return;

    }


    button.disabled = true;

    showMessage(
        'در حال ساخت حساب...'
    );


    try{

        const {
            data,
            error
        } =
        await supabase.auth.signUp({

            email:email,

            password:password,

            options:{

                emailRedirectTo:
                'https://vensiz.github.io/'

            }

        });


        if(error){

            console.error(error);

            showMessage(
                error.message
            );

            return;

        }


        showMessage(
            'ثبت‌نام انجام شد. لطفاً ایمیل خود را باز کنید و حساب خود را تأیید کنید.'
        );


    }

    catch(error){

        console.error(error);

        showMessage(
            'خطایی در ارتباط با سرور رخ داد.'
        );

    }

    finally{

        button.disabled = false;

    }

}



/* =========================
   LOGIN
========================= */

async function login(){

    const email =
    document
    .getElementById('loginEmail')
    .value
    .trim();


    const password =
    document
    .getElementById('loginPassword')
    .value;


    const button =
    document
    .getElementById('loginButton');


    if(!email){

        showMessage(
            'لطفاً ایمیل خود را وارد کنید.'
        );

        return;

    }


    if(!password){

        showMessage(
            'لطفاً رمز عبور را وارد کنید.'
        );

        return;

    }


    button.disabled = true;

    showMessage(
        'در حال ورود...'
    );


    try{

        const {
            data,
            error
        } =
        await supabase.auth.signInWithPassword({

            email:email,

            password:password

        });


        if(error){

            console.error(error);

            showMessage(
                error.message
            );

            return;

        }


        showMessage(
            'ورود موفق بود...'
        );


        setTimeout(

            function(){

                window.location.href =
                'index.html';

            },

            700

        );


    }

    catch(error){

        console.error(error);

        showMessage(
            'خطایی در ارتباط با سرور رخ داد.'
        );

    }

    finally{

        button.disabled = false;

    }

}



/* =========================
   ENTER KEY
========================= */

document.addEventListener(

    'keydown',

    function(event){

        if(event.key !== 'Enter'){
            return;
        }


        const loginActive =
        document
        .getElementById('loginForm')
        .classList
        .contains('active');


        if(loginActive){

            login();

        }

        else{

            signup();

        }

    }

);


</script>


</body>

</html>
