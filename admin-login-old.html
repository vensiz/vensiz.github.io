<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VENSIZ ADMIN LOGIN</title>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:tahoma;
}


body{

min-height:100vh;

display:flex;

align-items:center;

justify-content:center;

background:
linear-gradient(rgba(0,255,100,.03) 1px,transparent 1px),
linear-gradient(90deg,rgba(0,255,100,.03) 1px,transparent 1px),
#020403;

background-size:50px 50px;

color:white;

}



.login-box{

width:380px;

background:#071008;

border:1px solid rgba(0,255,100,.2);

border-radius:20px;

padding:35px;

box-shadow:
0 0 30px rgba(0,255,100,.1);

}



h1{

text-align:center;

color:#00ff66;

margin-bottom:30px;

text-shadow:
0 0 20px #00ff66;

}



input{

width:100%;

padding:15px;

margin-bottom:15px;

background:#030603;

border:

1px solid rgba(0,255,100,.2);

border-radius:12px;

color:white;

outline:none;

}



button{

width:100%;

padding:15px;

background:#00ff66;

border:none;

border-radius:12px;

cursor:pointer;

font-weight:bold;

}



button:hover{

box-shadow:
0 0 20px #00ff66;

}



#error{

margin-top:15px;

color:#ff7777;

text-align:center;

font-size:14px;

}



</style>


</head>


<body>


<div class="login-box">


<h1>
VENSIZ ADMIN
</h1>


<input id="username" placeholder="نام کاربری">


<input id="password" type="password" placeholder="رمز عبور">


<button onclick="login()">

ورود

</button>


<div id="error"></div>


</div>





<script>


const SUPABASE_URL =
"https://gpeckwmjsgklzhtgqdso.supabase.co";


const SUPABASE_KEY =
"sb_publishable_L4G2SJVjpML_5NiKb4tS7A_qXc5MzTZ";



const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);




async function login(){


let username =
document.getElementById("username").value;


let password =
document.getElementById("password").value;



const {data,error} =
await db
.from("admins")
.select("*")
.eq(
"username",
username
)
.eq(
"password",
password
)
.single();



if(error || !data){


document.getElementById("error").innerHTML =
"یوزرنیم یا رمز عبور اشتباه است";


return;

}




localStorage.setItem(

"vensiz_admin",

JSON.stringify(data)

);



window.location.href =
"admin.html";



}



</script>


</body>

</html>
